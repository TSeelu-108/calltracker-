<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Call Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Call Tracker</title>
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#17202b; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#0f5f8c; --accent-ink:#ffffff; --accent-soft:#e3eff7;
  --red-fill:#fde3e1; --red-edge:#e7a29c; --red-ink:#8f2a22;
  --yel-fill:#fff3c4; --yel-edge:#e3c45a; --yel-ink:#7a5a00;
  --grn-fill:#d9f2de; --grn-edge:#88c997; --grn-ink:#1d6a33;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a; --surface:#18202a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3542;
  --accent:#5fb3e6; --accent-ink:#06121c; --accent-soft:#1a3244;
  --red-fill:#4a2321; --red-edge:#8a3e38; --red-ink:#ffc9c3;
  --yel-fill:#463b14; --yel-edge:#8c7426; --yel-ink:#ffe69a;
  --grn-fill:#1d3d27; --grn-edge:#3f7d50; --grn-ink:#b8ecc5; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0 48px}

header.top{background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.row1{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.today .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.today .date{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.01em}
.today .sub{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:inherit;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.staffrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.staffrow select{grid-column:1 / 3}
.staffrow select,.staffrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:42px;min-width:0;width:100%;font:inherit;color:inherit}
.staffx{grid-row:1;grid-column:3;border:1px solid var(--line);background:transparent;border-radius:8px;min-height:42px;font-size:20px;color:var(--muted)}
.staffline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:14px;padding:4px 0}
.staffline a{color:var(--accent);font-weight:600}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.wk{display:grid;grid-template-columns:52px 1fr 1fr;gap:6px;align-items:center;margin-top:6px}
.wk button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:40px;font-size:14px;font-weight:600;color:var(--muted)}
.wk button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk .dl{border:0;background:transparent;text-align:left;padding:0;color:var(--ink);font-weight:700}
.fld{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-weight:600;font-size:14px}
.fld input,.fld select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px;font:inherit;font-weight:400;color:inherit;width:100%}
.s-add{--f:var(--surface);--k:var(--accent);--t:var(--accent)}
.addtag{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-size:12px;color:var(--muted);font-weight:600;line-height:1.3}
.addtag b{font-family:var(--f-disp);font-size:22px;color:var(--ink)}
.days14{max-height:300px;overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;padding:4px 8px;margin-top:6px}
.days14 button{display:flex;justify-content:space-between;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 4px;font-size:15px;color:var(--ink);text-align:left}
.days14 button:last-child{border-bottom:0}
.days14 button[aria-current=true]{background:var(--accent-soft);border-radius:8px}
.days14 .zero{color:var(--muted)}
.dd svg{width:20px;height:20px;flex:none}

.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:24px;height:24px}
.brand h1{font-family:var(--f-disp);font-size:26px;line-height:1.1;margin:0;letter-spacing:-.01em}
.brand .bsub{font-size:14px;color:var(--muted);margin-top:2px}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none;text-decoration:none}
.iconbtn svg{width:22px;height:22px}
.backlink{display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:600;font-size:15px;text-decoration:none;min-height:36px;margin-left:-4px}
.backlink svg{width:20px;height:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-weight:700;font-size:15px;line-height:1.2;min-height:84px;text-align:left;cursor:pointer;box-shadow:0 1px 2px rgba(15,25,35,.05)}
.tile .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tb);color:var(--tf)}
.tile .ic svg{width:21px;height:21px}
.tile:disabled{opacity:.5}
.tile.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.primary .ic{background:rgba(255,255,255,.2);color:var(--accent-ink)}
.t-blue{--tb:#e3eff7;--tf:#0f5f8c}.t-green{--tb:#dcf1e2;--tf:#1d6a33}.t-amber{--tb:#fdf0c8;--tf:#7a5a00}.t-plum{--tb:#ece5f5;--tf:#5b3f8c}.t-slate{--tb:#e8edf2;--tf:#3a4757}.t-teal{--tb:#d6f1ec;--tf:#0b6b5e}.tile.t-teal{border-color:#9fd9cd}
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.14s}
.sheet p.sechd{max-width:none}
.sechd{display:block;margin:18px 0 8px;padding:7px 12px;border-radius:9px;background:#e3eff7;color:#0f5f8c;font-weight:700;letter-spacing:.01em}
@media (prefers-color-scheme:dark){.sechd{background:#1a3244;color:#8fcaf0}}
@media (prefers-color-scheme:dark){.t-blue{--tb:#1a3244;--tf:#8fcaf0}.t-green{--tb:#1d3d27;--tf:#b8ecc5}.t-amber{--tb:#463b14;--tf:#ffe69a}.t-plum{--tb:#33284a;--tf:#d6c6f2}.t-slate{--tb:#26303b;--tf:#c9d3dd}.t-teal{--tb:#17393a;--tf:#9fe3d6}.tile.t-teal{border-color:#2f6b62}}
.tile.dd{border-color:#c9b8e3}

.bz{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.bz span{font-size:11px;font-weight:700;border:1px solid var(--yel-edge);background:var(--yel-fill);color:var(--yel-ink);border-radius:6px;padding:1px 6px}
.bz span.away{border-color:var(--line);background:var(--surface);color:var(--muted)}
.qwrap{position:relative;display:flex;min-width:0}
.qwrap>input{flex:1;min-width:0;width:100%;padding-right:42px!important}
.qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;min-height:0;padding:0;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.logday select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:40px;font:inherit;color:inherit}
.offbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}


.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.logday{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.logday input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:40px}
.logday .warn{color:var(--red-ink);font-weight:600}

.install{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--line);font-size:15px}
.install b{display:block;margin-bottom:2px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px 10px}
.tools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--k);background:var(--f)}

.colhead{display:grid;grid-template-columns:minmax(0,1fr) 150px 132px;gap:10px;padding:0 10px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.colhead .car{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.doc{display:grid;grid-template-columns:minmax(0,1fr) 150px 132px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.name{border:1px solid var(--k);background:var(--f);border-radius:9px;padding:8px 10px;text-align:left;min-width:0;width:100%;color:var(--ink)}
.name .n{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.name .c{font-size:13px;color:var(--muted)}
.name .last{font-size:12px;color:var(--t);font-weight:600}
.s-red{--f:var(--red-fill);--k:var(--red-edge);--t:var(--red-ink)}
.s-yel{--f:var(--yel-fill);--k:var(--yel-edge);--t:var(--yel-ink)}
.s-grn{--f:var(--grn-fill);--k:var(--grn-edge);--t:var(--grn-ink)}
.car{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-variant-numeric:tabular-nums}
.car div{font-family:var(--f-disp);font-size:22px;font-weight:600;line-height:1.1}
.car small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-ui);letter-spacing:.06em;font-weight:600}
.car .r{font-weight:800}
.act{display:flex;gap:6px;justify-content:flex-end}
.call{flex:1;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:52px;font-size:16px;padding:0 10px;transition:transform .08s}
.call:active{transform:scale(.96)}
.undo{border:1px solid var(--line);background:transparent;border-radius:10px;min-width:44px;min-height:52px;font-size:20px;color:var(--muted)}
.undo:disabled{opacity:.3}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;color:var(--ink);font-family:var(--f-disp)}
.empty p{margin:0;max-width:52ch}
.flash{animation:fl .6s ease-out}
@keyframes fl{from{box-shadow:0 0 0 4px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.call{transition:none}}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .colhead{display:none}
  .doc{grid-template-columns:minmax(0,1fr) 112px;grid-template-areas:"n n" "c a"}
  .doc .name{grid-area:n}.doc .car{grid-area:c}.doc .act{grid-area:a}
  .today .date{font-size:22px}
}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:760px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--f-disp);font-size:24px;margin:0 0 4px}
.sheet p{margin:6px 0;color:var(--muted);max-width:62ch}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;margin-top:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumb{width:86px;border:2px solid var(--line);border-radius:8px;overflow:hidden;font-size:11px;text-align:center;background:var(--bg)}
.thumb img{display:block;width:100%;height:64px;object-fit:cover}
.thumb div{padding:3px}
.thumb.ok{border-color:var(--grn-edge)} .thumb.bad{border-color:var(--red-edge)} .thumb.busy{border-color:var(--accent)}
.status{margin-top:12px;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.rtable{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.rtable table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.rtable th,.rtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rtable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.rtable td.num input{width:52px;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--bg);text-align:center;font-size:16px}
.rtable tr.check td{background:var(--yel-fill)}
.rtable .x{border:0;background:transparent;color:var(--muted);font-size:20px;min-width:40px;min-height:40px}
.summary{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-weight:600}
.summary .bad{color:var(--red-ink)} .summary .good{color:var(--grn-ink)}
.hist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hist button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:40px;color:var(--red-ink)}
.confirm{margin-top:12px;padding:12px;border-radius:10px;background:var(--red-fill);border:1px solid var(--red-edge);color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.okline{color:var(--grn-ink);font-weight:600}
/* ---------- tab bar layout (Home · Doctors · Plan my week · More) ---------- */
:root{--tabh:64px;--bar-red:#cf5a4f;--bar-yel:#d4a017;--bar-grn:#3a9a57;--track:#e6ebf0}
@media (prefers-color-scheme:dark){:root{--bar-red:#e0786d;--bar-yel:#e2b93b;--bar-grn:#5cc07a;--track:#2a3542}}
body{padding-bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px))}
header.top{border-bottom:0;padding-bottom:6px}
.titlebar{align-items:flex-start}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.vtitle{font-family:var(--f-disp);font-size:32px;line-height:1.1;margin:2px 0 0;letter-spacing:-.015em}
.bsub{font-size:14px;color:var(--muted);margin-top:3px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 94%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:650;text-decoration:none;border-radius:10px}
.tab svg{width:24px;height:24px}
.tab[aria-current=page]{color:var(--accent)}
.view{margin-top:6px}
.offday{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;padding:10px 14px;border-radius:12px;background:var(--yel-fill);border:1px solid var(--yel-edge);color:var(--yel-ink);font-weight:650}
.offday .btn{background:var(--surface);color:var(--ink)}
.qcard{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:10px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.qbig{font-family:var(--f-disp);font-size:24px;font-weight:750;margin:6px 0 4px;letter-spacing:-.01em}
.qline{font-size:15px;color:var(--muted)}
.qline b{color:var(--ink)}
.qstat{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:700;border-radius:999px;padding:4px 11px}
.qstat.ok{background:var(--grn-fill);color:var(--grn-ink)}
.qstat.amb{background:var(--yel-fill);color:var(--yel-ink)}
.qstat:empty{display:none}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ring{--p:0;width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--track) 0);display:grid;place-items:center;flex:none}
.ring span{width:76px;height:76px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:21px}
.grp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 2px 8px}
.grp h2{font-family:var(--f-disp);font-size:20px;margin:0}
.cardlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.stop{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.stop:last-child{border-bottom:0}
.stop .sn{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--muted)}
.stop.done .sn{background:var(--bar-grn);border-color:var(--bar-grn);color:#fff}
.stop .nm{font-family:var(--f-disp);font-weight:700;font-size:17px;border:0;background:transparent;padding:0;text-align:left;color:var(--ink)}
.stop .mt{font-size:13px;color:var(--muted)}
.stop .mt a{color:var(--accent);font-weight:600;text-decoration:none}
.stop .act{display:flex;gap:6px;align-items:center}
.doc .act{justify-content:flex-end}
.slot{padding:6px 14px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--line)}
.noplan{padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted)}
.hfind input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:48px;-webkit-appearance:none}
#hResults{margin-top:8px}
.otherday{margin:22px 2px 0;font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.otherday input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:40px}
.linkbtn{border:0;background:transparent;padding:4px 0;color:var(--accent);font-weight:650;font-size:14px}
/* doctor rows */
.doc{grid-template-columns:minmax(0,1fr) 190px 150px;padding:10px 12px;gap:14px}
.name{border:0;background:transparent;padding:2px 0}
.name .n{font-size:18px}
.name .c{font-size:13.5px}
.dprog{font-size:13.5px;color:var(--muted)}
.dprog b{color:var(--ink)}
.dbar{height:7px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:6px}
.dbar i{display:block;height:100%;border-radius:99px;min-width:5px}
.s-red .dbar i,.dbar.s-red i{background:var(--bar-red)} .dbar.s-yel i{background:var(--bar-yel)} .dbar.s-grn i{background:var(--bar-grn)}
.call{min-height:46px;padding:0 16px;flex:none}
.call.ghostcall{background:transparent;color:var(--accent);border:1px solid var(--line)}
.undo{min-height:46px}
.donepill{font-size:13px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--grn-fill);color:var(--grn-ink);white-space:nowrap}
@media (max-width:640px){.doc{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "c c"}.doc .name{grid-area:n}.doc .dprog{grid-area:c}.doc .act{grid-area:a}.qcard{grid-template-columns:1fr}.ring{display:none}}
/* More */
.mlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:12px}
.mrow{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;color:var(--ink);text-decoration:none}
.mrow:last-child{border-bottom:0}
.mrow[hidden]{display:none!important}
.mic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--tb);color:var(--tf);flex:none}
.mic svg{width:21px;height:21px}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column}
.mtx b{font-size:17px}
.mtx span{font-size:13.5px;color:var(--muted)}
.mtx em{font-style:normal;font-weight:700;color:var(--accent)}
.mchev{font-size:24px;color:var(--muted);line-height:1}
/* setup checklist */
.setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:10px}
.setup .shd{padding:16px 18px 6px}
.setup .shd h2{font-family:var(--f-disp);font-size:22px;margin:0}
.step{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.step.now{background:var(--accent-soft)}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid var(--line);color:var(--muted);flex:none}
.step.ok .num{background:var(--bar-grn);border-color:var(--bar-grn);color:#fff}
.step.now .num{border-color:var(--accent);color:var(--accent)}
.step .stx{flex:1;min-width:0}
.step h3{margin:0;font-size:16.5px}
.step p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.step .opt{font-weight:500;color:var(--muted);font-size:14px}
.setup .sft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px 14px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.toast{bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px))}
.remind{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
.remind > div{flex:1 1 300px;display:flex;flex-direction:column;gap:2px}
.remind span{font-size:13.5px;color:var(--muted)}
.remind.nq{border-left-color:var(--yel-edge)}
.docfoot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cands{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.cand{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lact{display:flex;gap:6px;flex-wrap:wrap}
.bz span.lunch{border-color:#c9b8e3;background:#f3eefa;color:#5b3f8c}
@media (prefers-color-scheme:dark){.bz span.lunch{border-color:#5b4a7a;background:#2a2238;color:#d6c6f2}}
.lunchline{margin-top:8px;font-size:14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;width:100%;text-align:left;background:var(--surface);color:var(--muted);font-family:inherit}
.lunchline .lchg{margin-left:auto;color:var(--accent);font-weight:600}
.lunchbox .stop.lsend{width:100%;border:0;background:var(--yel-fill);font:inherit;color:inherit;cursor:pointer}
.lunchbox .stop.lsend .sn{border-color:var(--yel-edge);color:var(--yel-ink)}
.lnudge{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:11px 14px;border-radius:12px;background:var(--yel-fill);border:1px solid var(--yel-edge);color:var(--yel-ink);font:inherit;text-align:left;cursor:pointer}
.lnudge .btn{margin-left:auto;background:var(--surface);color:var(--ink)}
.ltag{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 8px;background:#f3eefa;color:#5b3f8c;vertical-align:2px;margin-left:4px}
@media (prefers-color-scheme:dark){.ltag{background:#2a2238;color:#d6c6f2}}
#lunchTab .sechd{margin-top:16px}
.ldlist{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ldone{border-bottom:1px solid var(--line)}.ldone:last-child{border-bottom:0}
.ldhead{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.ldd{flex:none;width:96px;font-weight:700;font-size:14px}
.ldt{flex:1;min-width:0;display:flex;flex-direction:column}
.ldok{flex:none;color:var(--grn-ink);font-size:13px;font-weight:650}
.ldone.open{background:var(--bg)}
.stop.next{background:var(--accent-soft)}
.nextpill{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 8px;vertical-align:3px;margin-right:2px}
.stop .mt.info{margin-top:2px;color:var(--muted);font-size:12.5px}
.stop .mt.info a{color:var(--accent);font-weight:600}
.smore{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:40px;min-height:46px;font-size:18px;color:var(--muted)}
.dirbtn{white-space:nowrap}
.cand.smenu{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;width:100%;cursor:pointer}
/* phone: keep scrolled content out from under the clock, and fit the tab labels */
body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.tl-short{display:none}
@media (max-width:520px){.tl-long{display:none}.tl-short{display:inline}}
/* phone: a stop's buttons go on their own row under the name, so nothing gets squeezed */
@media (max-width:600px){
  .stop.next{grid-template-columns:30px minmax(0,1fr);row-gap:10px}
  .stop.next .act{grid-column:2;justify-content:flex-start}
  .stop.next .act .call{flex:1;max-width:170px}
  .stop .call{padding:0 12px}
  .stop .sn{width:28px;height:28px;font-size:13px}
  .stop{padding:12px}
}

<script>
"use strict";
const KEY = "callplan.tracker.v1";
const TJS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/";
const CORE = "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/";
const LANG = "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int";
const VCACHE = "calltracker-vendor-v1";

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const isoDay = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO = () => isoDay(new Date());
const fromISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const longDate = s => fromISO(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const shortDate = s => fromISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const daysAgo = s => Math.round((fromISO(todayISO()) - fromISO(s))/864e5);

/* ---------- state (saved only on this device) ---------- */
const norm = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
/* A misread name ("ORAH KIM", "HI SAMUEL OKAFOR", "ANA ROSS") is matched to the doctor already on your list,
   when exactly one is that close. A misread city ("LOPI") to the nearest known city. */
function editDist(a, b){ const m = a.length, n = b.length; if (Math.abs(m - n) > 3) return 9; let prev = Array.from({length:n+1}, (_,j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; } return prev[n]; }
function snapName(raw){
  const id = norm(raw); const known = state.doctors.map(d => ({id:d.id, name:d.name})).concat((state.dropped || []).map(d => ({id:d.id, name:d.name})));
  if (!known.length || known.some(k => k.id === id)) return raw;
  const lastOf = x => x.split(" ").pop(), flat = x => x.replace(/ /g, "");
  const hits = known.filter(k => {
    if (id.endsWith(" " + k.id) && id.slice(0, -k.id.length).trim().split(" ").every(t => t.length <= 3)) return true;   // junk in front
    if (flat(id) === flat(k.id)) return true;                                                                            // "MEILING" / "MEI LING"
    return k.id.length >= 7 && editDist(id, k.id) <= 2 && editDist(lastOf(id), lastOf(k.id)) <= 1;                     // a letter or two off
  });
  const uniq = [...new Map(hits.map(h => [h.id, h])).values()];
  return uniq.length === 1 ? uniq[0].name : raw;
}
function snapCity(raw){
  const c = String(raw || "").trim().toLowerCase(); if (!c || CITY_NAMES.includes(c)) return raw;
  const hits = CITY_NAMES.filter(x => x.length >= 4 && Math.abs(x.length - c.length) <= 1 && editDist(c, x) <= 1);
  return hits.length === 1 ? hits[0].toUpperCase() : raw;
}
function makeDoc(name, city, c, a, r, last){
  a = Math.max(0, +a||0); c = Math.max(0, +c||0);
  r = (r===""||r==null||isNaN(+r)) ? Math.max(0,a-c) : Math.max(0,+r);
  const lastRpt = /^\d{4}-\d{2}-\d{2}$/.test(last||"") && last <= todayISO() ? last : null;
  return {id:norm(name), name:String(name).trim().toUpperCase(), city:String(city||"").trim().toUpperCase(), c0:c, a, r0:r, lastRpt, log:[]};
}
/* ---------- office staff contacts (shared by the Call Tracker and Plan my week) ----------
   Only a title from a fixed list, a name (letters only) and a phone number (digits only)
   can be saved. There is no free-text note anywhere. */
const STAFF_KEY = "office.staff.v1", DOCOFF_KEY = "doctor.offices.v1";
const STAFF_TITLES = ["Office manager","Medical assistant","Scribe","Front desk","Nurse","Practice administrator"];
try { localStorage.removeItem("doctor.notes.v1"); } catch(e){}
function staffClean(c){
  const n = staffName(c && c.n).trim(), p = staffPhone(c && c.p);
  const t = STAFF_TITLES.includes(c && c.t) ? c.t : "Front desk";
  return n || p ? {t, n, p} : null;
}
function staffName(s){
  s = String(s || "").normalize("NFC").replace(/[^\p{L}\s'\-]/gu, "").replace(/\s+/g, " ").replace(/^[\s'\-]+/, "").slice(0, 30);
  return s.replace(/(^|[\s\-'])(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase());
}
function staffPhone(s){ let d = String(s || "").replace(/\D/g, ""); if (d.length === 11 && d[0] === "1") d = d.slice(1); return d.slice(0, 10); }
function staffFmtPhone(d){ d = staffPhone(d); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d.length > 6 ? d.slice(0,3) + "-" + d.slice(3,6) + "-" + d.slice(6) : d.length > 3 ? d.slice(0,3) + "-" + d.slice(3) : d; }
function staffAll(){ try { const o = JSON.parse(localStorage.getItem(STAFF_KEY)) || {}; const out = {}; for (const k in o) if (Array.isArray(o[k])){ const l = o[k].map(staffClean).filter(Boolean); if (l.length) out[k] = l; } return out; } catch(e){ return {}; } }
function staffFor(k){ return staffAll()[k] || []; }
function staffSet(k, list){ const all = staffAll(); const l = (list || []).map(staffClean).filter(Boolean).slice(0, 8); if (l.length) all[k] = l; else delete all[k]; try { localStorage.setItem(STAFF_KEY, JSON.stringify(all)); } catch(e){} }
function staffMerge(obj){ if (!obj || typeof obj !== "object") return; for (const k in obj){ if (!Array.isArray(obj[k])) continue; const cur = staffFor(k); obj[k].forEach(c => { const x = staffClean(c); if (x && !cur.some(y => y.n === x.n && y.p === x.p)) cur.push(x); }); staffSet(k, cur); } }
function staffOfficesFor(docId){ try { return (JSON.parse(localStorage.getItem(DOCOFF_KEY)) || {})[docId] || []; } catch(e){ return []; } }
function staffLineHtml(c){
  const p = c.p ? staffFmtPhone(c.p) : "";
  return `<div class="staffline"><span><b>${staffEsc(c.n || "No name")}</b> · ${staffEsc(c.t)}</span>${c.p && c.p.length >= 7 ? `<span><a href="tel:${c.p}">${p}</a> · <a href="sms:${c.p}">Text</a></span>` : (p ? `<span>${p}</span>` : "")}</div>`;
}
const staffEsc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function staffRowHtml(c, i){
  return `<div class="staffrow" data-srow="${i}">
    <select data-st aria-label="Title">${STAFF_TITLES.map(t => `<option${t === c.t ? " selected" : ""}>${t}</option>`).join("")}</select>
    <input data-sn value="${staffEsc(c.n)}" placeholder="Name" aria-label="Name" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="30">
    <input data-sp value="${staffEsc(staffFmtPhone(c.p))}" placeholder="Phone" aria-label="Phone" type="tel" inputmode="tel" autocomplete="off">
    <button type="button" class="staffx" data-sx aria-label="Remove this contact">×</button>
  </div>`;
}
/* A block that edits the contacts for one office. Call staffWire(box) after inserting it and staffRead(box) to get the list. */
function staffEditorHtml(list){
  const l = list.length ? list : [{t:"Front desk", n:"", p:""}];
  return `<div class="staffed">${l.map(staffRowHtml).join("")}</div><button type="button" class="btn small ghost" data-sadd>+ Add a staff contact</button>`;
}
function staffWire(box){
  const ed = box.querySelector(".staffed");
  const hook = row => {
    const n = row.querySelector("[data-sn]"), p = row.querySelector("[data-sp]");
    n.oninput = () => { const v = staffName(n.value); if (v !== n.value) n.value = v; };
    p.oninput = () => { const v = staffFmtPhone(p.value.replace(/\D/g, "")); if (v !== p.value) p.value = v; };
    row.querySelector("[data-sx]").onclick = () => { row.remove(); if (!ed.children.length) add(); };
  };
  const add = () => { const t = document.createElement("div"); t.innerHTML = staffRowHtml({t:"Front desk", n:"", p:""}, ed.children.length); const row = t.firstElementChild; ed.appendChild(row); hook(row); return row; };
  ed.querySelectorAll(".staffrow").forEach(hook);
  box.querySelector("[data-sadd]").onclick = () => { if (ed.children.length < 8) add().querySelector("[data-sn]").focus(); };
}
function staffRead(box){
  return [...box.querySelectorAll(".staffrow")].map(r => staffClean({t: r.querySelector("[data-st]").value, n: r.querySelector("[data-sn]").value.trim(), p: r.querySelector("[data-sp]").value})).filter(Boolean);
}

/*__DATA_START__*/
/* ---------- backups: one file with everything this app keeps on this iPad (both halves), saved to Files ---------- */
const BK_META = "backup.meta.v1";
const BK_SKIP = /^(pending\.|backup\.meta|device\.allow)/;
const bkToday = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); };
const bkDays = (a, b) => { const p = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); }; return Math.round((p(b) - p(a)) / 864e5); };
function bkMeta(){ let m = {}; try { m = JSON.parse(localStorage.getItem(BK_META)) || {}; } catch(e){} return Object.assign({every:"weekly", at:null, first:null, snooze:null}, m); }
function bkSetMeta(m){ try { localStorage.setItem(BK_META, JSON.stringify(m)); } catch(e){} }
function bkHasData(){ try { const t = JSON.parse(localStorage.getItem("callplan.tracker.v1")); return !!(t && ((t.doctors && t.doctors.length) || (t.HCPs && t.HCPs.length))); } catch(e){ return false; } }
// a reminder is due once a day or a week has passed since the last backup (or since there was anything to back up)
function bkDue(){
  if (!bkHasData()) return false;
  const m = bkMeta(), t = bkToday();
  if (!m.first){ m.first = t; bkSetMeta(m); }
  if (m.every === "off" || (m.snooze && m.snooze >= t)) return false;
  if (!m.at) return true;   // never backed up: ask now (Later waits a day)
  return bkDays(m.at, t) >= (m.every === "daily" ? 1 : 7);
}
function bkWhen(){ const m = bkMeta(); if (!m.at) return "No backup saved yet"; const n = bkDays(m.at, bkToday()); return "Last backup: " + (n === 0 ? "today" : n === 1 ? "yesterday" : n + " days ago"); }
function bkSnooze(){ const m = bkMeta(); m.snooze = bkToday(); bkSetMeta(m); }
function bkSave(){
  const data = {}; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && !BK_SKIP.test(k)) data[k] = localStorage.getItem(k); }
  const blob = new Blob([JSON.stringify({format:"calltracker-backup", version:2, savedAt:new Date().toISOString(), data})], {type:"application/json"});
  const name = "Call Tracker backup " + bkToday() + ".json";
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  const m = bkMeta(); m.at = bkToday(); m.snooze = null; bkSetMeta(m);
  return name;
}
// a backup from this app (everything), or an older Call Tracker or Plan my week backup (one half)
function bkRestore(text){
  let o; try { o = JSON.parse(text); } catch(e){ return {ok:false, msg:"That file isn't a backup from this app."}; }
  const mergeStaff = obj => { if (!obj || typeof obj !== "object") return; let cur = {}; try { cur = JSON.parse(localStorage.getItem("office.staff.v1")) || {}; } catch(e){} for (const k in obj) if (Array.isArray(obj[k])) cur[k] = (cur[k] || []).concat(obj[k]).slice(0, 8); try { localStorage.setItem("office.staff.v1", JSON.stringify(cur)); } catch(e){} };
  try {
    if (o && o.format === "calltracker-backup" && o.data && typeof o.data === "object"){
      const keep = []; for (let i = 0; i < localStorage.length; i++){ const k = localStorage.key(i); if (k && !BK_SKIP.test(k)) keep.push(k); }
      keep.forEach(k => localStorage.removeItem(k));
      for (const k in o.data) if (!BK_SKIP.test(k) && typeof o.data[k] === "string") localStorage.setItem(k, o.data[k]);
      const m = bkMeta(); m.at = bkToday(); bkSetMeta(m);
      return {ok:true, msg:"Restored everything from the backup of " + new Date(o.savedAt).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}) + "."};
    }
    if (o && Array.isArray(o.doctors)){ mergeStaff(o.staff); delete o.staff; delete o.notes; localStorage.setItem("callplan.tracker.v1", JSON.stringify(o)); return {ok:true, msg:`Restored ${o.doctors.length} HCPs from an older Call Tracker backup.`}; }
    if (o && o.settings){ mergeStaff(o.staff); delete o.staff; delete o.sharedNotes; delete o.notes; localStorage.setItem("weekrouter.v1", JSON.stringify(o)); return {ok:true, msg:"Restored an older Plan my week backup."}; }
  } catch(e){ return {ok:false, msg:"This iPad is out of space for the backup."}; }
  return {ok:false, msg:"That file isn't a backup from this app."};
}

/*__DATA_END__*/
/*__BOOK_START__*/
/* ---------- book lunches, coffees, breakfasts and snacks (shared by the Call Tracker and Plan my week) ----------
   Builds one calendar file (.ics) with every date you pick. Opened in Outlook, "Add all" puts them on your
   calendar as plain events (Outlook won't import an invite you organize yourself). The people to invite are
   listed in each event; adding them in Outlook sends the real invites from your account. Nothing is sent from this app. */
const INV_KEY = "invitees.v1", BOOK_KEY = "bookings.v1";
const BOOK_KINDS = [["Lunch","12:00"],["Coffee","09:00"],["Breakfast","08:00"],["Snacks","14:00"]];
const bEsc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bTitle = s => String(s||"").toLowerCase().replace(/(^|[\s\-'])([a-z])/g, (m,a,b) => a + b.toUpperCase());
const bEmail = s => { s = String(s||"").trim().toLowerCase(); return /^[^\s@<>,;]+@[^\s@<>,;]+\.[a-z]{2,}$/.test(s) ? s : ""; };
function invAll(){ try { const v = JSON.parse(localStorage.getItem(INV_KEY)) || {}; return {me: bEmail(v.me) || "", people: (v.people || []).map(p => ({name: staffName(p.name).trim(), email: bEmail(p.email), cp: !!p.cp})).filter(p => p.email)}; } catch(e){ return {me:"", people:[]}; } }
function invSave(v){ try { localStorage.setItem(INV_KEY, JSON.stringify(v)); } catch(e){} }
function bRouter(){ try { return JSON.parse(localStorage.getItem("weekrouter.v1")) || {}; } catch(e){ return {}; } }
function bTracker(){ try { const o = JSON.parse(localStorage.getItem("callplan.tracker.v1")) || {}; if (!o.doctors && o.HCPs) o.doctors = o.HCPs; return o; } catch(e){ return {}; } }
function bOffices(id){ return bAllOffices()[id] || []; }
// the same office key Plan my week uses ("5860 owens|pleasanton"), so HCPs at one address line up
function bCityKey(s){ return String(s||"").toLowerCase().replace(/[^a-z ]+/g," ").replace(/\s+/g," ").trim(); }
function bAddrKey(addr, city){
  let a = String(addr||"").toLowerCase().split(",")[0];
  a = a.replace(/\b(ste|suite|unit|bldg|building|fl|floor|rm|room)\b.*$/,"").replace(/#.*$/,"").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();
  const t = a.split(" "); let key = a;
  if (/^\d+$/.test(t[0]||"")){ let i = 1; while (i < t.length && /^(n|s|e|w|north|south|east|west)$/.test(t[i])) i++; key = t[0] + " " + (t[i]||""); }
  return key + "|" + bCityKey(city);
}
// offices as Plan my week last worked them out, plus any HCP whose office was set in the app since (like one you just added)
function bAllOffices(){
  let o = {}; try { o = JSON.parse(localStorage.getItem("doctor.offices.v1")) || {}; } catch(e){}
  const info = bRouter().docInfo || {};
  for (const id in info){ const locs = (info[id] && info[id].locs) || []; if (!locs.length) continue;
    const have = (o[id] || []).filter(x => !/^doc\|/.test(x.k));
    const add = locs.filter(l => l.address || l.city).map(l => ({k: bAddrKey(l.address || l.city, l.city), a: [l.address, l.city].filter(Boolean).join(", ")}));
    o[id] = have.concat(add.filter(x => !have.some(h => h.k === x.k))); }
  return o;
}
function bookingsAll(){ let l = []; try { l = JSON.parse(localStorage.getItem(BOOK_KEY)) || []; } catch(e){}
  if (l.some(b => !b.id)){ l.forEach(b => { if (!b.id) b.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }); try { localStorage.setItem(BOOK_KEY, JSON.stringify(l)); } catch(e){} }
  return l; }
function bookingsSet(id, patch){ const all = bookingsAll(), b = all.find(x => x.id === id); if (!b) return; if (patch) Object.assign(b, patch); else all.splice(all.indexOf(b), 1); try { localStorage.setItem(BOOK_KEY, JSON.stringify(all)); } catch(e){} }
const bUpcoming = () => { const t = bIso(new Date()); return bookingsAll().filter(b => b.date >= t).sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time)); };
const bToSend = () => bUpcoming().filter(b => !b.sent);
const bWhenTxt = b => new Date(b.date + "T12:00").toLocaleDateString(undefined,{weekday:"short", month:"short", day:"numeric"});
// HCPs you've added to a lunch at an office: remembered there for next time
const LX_KEY = "lunch.extra.v1";
function lxAll(){ try { return JSON.parse(localStorage.getItem(LX_KEY)) || {}; } catch(e){ return {}; } }
function lxAdd(k, ids){ if (!k || !ids.length) return; const a = lxAll(); a[k] = [...new Set((a[k] || []).concat(ids))]; try { localStorage.setItem(LX_KEY, JSON.stringify(a)); } catch(e){} }
function bookingsDrop(i){ const all = bookingsAll(); all.splice(i, 1); try { localStorage.setItem(BOOK_KEY, JSON.stringify(all)); } catch(e){} }
function bookingsAdd(list){ const cut = new Date(Date.now() - 14*864e5).toISOString().slice(0,10); const all = bookingsAll().filter(b => b.date >= cut).concat(list); try { localStorage.setItem(BOOK_KEY, JSON.stringify(all)); } catch(e){} }
const bDocName = id => { const d = (bTracker().doctors || []).find(x => x.id === id); return d ? d.name : id; };
const bLast = id => bTitle(bDocName(id).split(" ").pop());
const bIso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");

/* People I invite (kept on this device only) */
function openInvitees(back){
  const v = invAll();
  const row = (p, i) => `<div class="staffrow" data-ivrow="${i}" style="grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 40px">
      <input data-ivn value="${bEsc(p.name)}" placeholder="Their name" autocomplete="off" autocapitalize="words" style="grid-column:auto">
      <input data-ive value="${bEsc(p.email)}" placeholder="Their email" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="staffx" data-ivx style="grid-row:auto;grid-column:auto" aria-label="Remove">×</button>
      <label class="small" style="grid-column:1 / -1;display:flex;gap:8px;align-items:center;justify-content:flex-start;text-align:left;font-weight:400;margin:2px 0 6px"><input type="checkbox" data-ivc ${p.cp ? "checked" : ""} style="width:20px;height:20px;min-height:0;flex:none;margin:0;padding:0"> <span>Invite to lunches and coffees automatically</span></label></div>`;
  openSheet(`<h2>People I invite</h2>
    <p>Saved on this iPad only. Tick the ones (like your pod members) who should be invited to every lunch and coffee automatically. Others, like your manager, you can pick when you need them.</p>
    <label class="fld" style="display:flex;flex-direction:column;gap:4px;margin-top:10px;font-weight:600">Your work email<span class="small" style="font-weight:400">You're the organizer of the invites.</span><input id="ivMe" value="${bEsc(v.me)}" type="email" inputmode="email" autocomplete="off" autocapitalize="off" spellcheck="false" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px"></label>
    <p style="margin-top:22px"><b style="color:var(--ink)">Invitees</b><br><span class="small">The people you invite, like your pod members and your manager. Not you.</span></p>
    <div id="ivList" style="margin-top:6px">${(v.people.length ? v.people : [{name:"", email:"", cp:true}]).map(row).join("")}</div>
    <button type="button" class="btn small ghost" id="ivAdd" style="margin-top:8px">+ Add an invitee</button>
    <p class="small" id="ivErr" style="color:var(--red-ink)"></p>
    <div class="foot"><button class="btn" id="ivX">Cancel</button><button class="btn primary" id="ivOk">Save</button></div>`);
  const wire = el => { el.querySelector("[data-ivx]").onclick = () => el.remove(); const n = el.querySelector("[data-ivn]"); n.oninput = () => { const s = staffName(n.value); if (s !== n.value) n.value = s; }; };
  $("ivList").querySelectorAll("[data-ivrow]").forEach(wire);
  $("ivAdd").onclick = () => { const t = document.createElement("div"); t.innerHTML = row({name:"", email:"", cp:false}, Date.now()); const el = t.firstElementChild; $("ivList").appendChild(el); wire(el); el.querySelector("[data-ivn]").focus(); };
  $("ivX").onclick = () => back ? back() : closeSheet();
  $("ivOk").onclick = () => {
    const me = bEmail($("ivMe").value); if ($("ivMe").value.trim() && !me){ $("ivErr").textContent = "Your email doesn't look right."; return; }
    const people = []; let bad = "";
    $("ivList").querySelectorAll("[data-ivrow]").forEach(r => { const name = staffName(r.querySelector("[data-ivn]").value).trim(), raw = r.querySelector("[data-ive]").value.trim(), email = bEmail(raw);
      if (!name && !raw) return; if (!email){ bad = (name || raw) + "'s email doesn't look right."; return; } people.push({name: name || email.split("@")[0], email, cp: r.querySelector("[data-ivc]").checked}); });
    if (bad){ $("ivErr").textContent = bad; return; }
    invSave({me, people}); toast("Saved"); back ? back() : closeSheet();
  };
}

/* the booking sheet. docId: the doctor you're with. Each date can be a different kind (lunch, coffee...) at a different
   one of their offices. Other HCPs at those offices can be added. */
function openBook(docId, back, opt){
  opt = opt || {};
  const offs = bOffices(docId), all = bAllOffices();
  const offOf = k => offs.find(o => o.k === k) || offs[0] || null;
  // the town of an office ("…, Pleasanton"); a doctor in more than one town gets it in the title so nobody goes to the wrong one
  const townOf = o => o ? bTitle(String(o.k || "").split("|")[1] || String(o.a || "").split(",").pop().trim()) : "";
  const towns = [...new Set(offs.map(townOf).filter(Boolean))];
  const v = invAll(); let me = (bRouter().settings || {}).myName || ""; const askName = !me;
  const st = {town: towns.length > 1, docs:[docId], rows:[{date:"", time:"12:00", mins:60, kind:"Lunch", k: opt.k && offs.some(o => o.k === opt.k) ? opt.k : offs[0] ? offs[0].k : ""}], extra:[], who: v.people.filter(p => p.cp).map(p => p.email), remind:"P1D"};
  // the doctors who share any of the offices picked
  const hereNow = () => { const ks = new Set(st.rows.map(r => r.k).filter(Boolean)), lx = lxAll(); const h = Object.keys(all).filter(id => (all[id] || []).some(o => ks.has(o.k)));
    ks.forEach(k => (lx[k] || []).forEach(id => { if (!h.includes(id)) h.push(id); })); st.extra.forEach(id => { if (!h.includes(id)) h.push(id); });
    if (!h.includes(docId)) h.unshift(docId); const known = new Set((bTracker().doctors || []).map(d => d.id)); return h.filter(id => id === docId || known.has(id)); };
  const tomorrow = () => { const d = new Date(); d.setDate(d.getDate() + 1); return bIso(d); };
  st.rows[0].date = tomorrow();
  // editing a saved booking: start from what it was
  const ed = opt.edit ? bookingsAll().find(b => b.id === opt.edit) : null;
  if (ed){
    const kOf = (ed.docs || []).flatMap(id => all[id] || []).find(o => o.a === ed.loc);
    st.rows = [{date: ed.date, time: ed.time, mins: ed.mins || 60, kind: ed.kind || "Lunch", k: kOf && offs.some(o => o.k === kOf.k) ? kOf.k : st.rows[0].k}];
    st.docs = (ed.docs || [docId]).slice(); st.extra = st.docs.slice();
    if (ed.who) st.who = ed.who.slice(); st.remind = ed.remind || "P1D";
    st.town = /\([^)]+\)\s*$/.test(ed.title || "");
  }
  const draw = (msg) => {
    const titleFor = r => `${r.kind} ${st.docs.map(bLast).join(" & ")}${me ? " - " + me.split(" ")[0] : ""}${st.town && townOf(offOf(r.k)) ? " (" + townOf(offOf(r.k)) + ")" : ""}`;
    const here = hereNow(); st.docs = st.docs.filter(id => here.includes(id));
    const kinds = [...new Set(st.rows.map(r => r.kind))];
    openSheet(`${ed ? `<h2>Change this ${bEsc(kinds[0].toLowerCase())}</h2>${ed.sent ? `<p class="small" style="color:var(--yel-ink);font-weight:600">This one was already sent. Saving moves it back to “To send”: send the new one from Outlook, and cancel the old invite there.</p>` : ""}` : `<h2>Book ${kinds.length === 1 ? (/s$/i.test(kinds[0]) ? "" : "a ") + kinds[0].toLowerCase() : "lunches and coffees"}</h2>`}
      ${offs.length ? (offs.length > 1 ? `<p class="small">${offs.length} offices. Pick the one for each date below.</p>` : `<p>${bEsc(offs[0].a)}</p>`) : `<p>Office address not known yet. Open Plan my week once to set it.</p>`}
      <p style="margin-top:12px"><b style="color:var(--ink)">With</b> <span class="small">· tick everyone the ${bEsc((st.rows[0].kind || "lunch").toLowerCase())} is for</span></p><div class="chips">${here.map(id => `<label class="chip" style="padding-right:10px"><input type="checkbox" data-bd="${bEsc(id)}" ${st.docs.includes(id) ? "checked" : ""}> ${bEsc(bTitle(bDocName(id)))}</label>`).join("")}</div>
      <div style="position:relative;margin-top:8px"><input type="search" id="bAddHcp" placeholder="+ Add another HCP" autocomplete="off" style="width:100%;max-width:360px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px"><div id="bAddSug" class="cands" style="max-width:360px"></div></div>
      <p style="margin-top:12px"><b style="color:var(--ink)">When</b> ${ed ? "" : `<span class="small">· add as many dates as you like, each its own kind${offs.length > 1 ? " and office" : ""}</span>`}</p>
      ${st.rows.map((r,i) => `<div class="logday" style="margin-top:8px;flex-wrap:wrap;gap:6px;${st.rows.length > 1 ? "border-top:1px solid var(--line);padding-top:8px" : ""}" data-br="${i}">
        <select data-bkind aria-label="Kind">${BOOK_KINDS.map(([k]) => `<option${k === r.kind ? " selected" : ""}>${k}</option>`).join("")}</select>
        <input type="date" data-bdate value="${r.date}"><input type="time" data-btime value="${r.time}" step="900">
        <select data-bmins>${[30,45,60,75,90,120].map(m => `<option value="${m}"${m===r.mins?" selected":""}>${m < 60 ? m + " min" : (m/60) + (m===60 ? " hour" : " hours")}</option>`).join("")}</select>
        ${st.rows.length > 1 ? `<button type="button" class="btn small ghost" data-brm="${i}" aria-label="Remove this date">×</button>` : ""}
        ${offs.length > 1 ? `<select data-boff aria-label="Office" style="flex-basis:100%;max-width:100%">${offs.map(o => `<option value="${bEsc(o.k)}"${o.k === r.k ? " selected" : ""}>${bEsc(townOf(o))} · ${bEsc(o.a)}</option>`).join("")}</select>` : ""}</div>`).join("")}
      ${ed ? "" : `<button type="button" class="btn small ghost" id="bAddDate" style="margin-top:6px">+ Add another date</button>`}
      <p style="margin-top:12px"><b style="color:var(--ink)">Invite</b> <button type="button" class="btn small ghost" id="bPeople" style="min-height:30px;padding:2px 8px">${v.people.length ? "Edit people" : "+ Add people"}</button></p>
      ${v.people.length ? `<div class="chips">${v.people.map(p => `<label class="chip" style="padding-right:10px"><input type="checkbox" data-bw="${bEsc(p.email)}" ${st.who.includes(p.email) ? "checked" : ""}> ${bEsc(p.name)}</label>`).join("")}</div>` : `<p class="small">No one saved yet. Add your pod members (and anyone else you sometimes invite) once, and they'll be here.</p>`}
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px">Reminder <select id="bRem"><option value="">None</option><option value="PT0M"${st.remind==="PT0M"?" selected":""}>When it starts</option><option value="PT1H"${st.remind==="PT1H"?" selected":""}>1 hour before</option><option value="P1D"${st.remind==="P1D"?" selected":""}>1 day before</option><option value="P2D"${st.remind==="P2D"?" selected":""}>2 days before</option></select></label>
      ${askName ? `<label class="small" style="display:flex;flex-direction:column;gap:4px;margin-top:12px"><span><b style="color:var(--ink)">Your name</b> · finishes the title. Saved for next time.</span><input id="bMe" value="${bEsc(me)}" placeholder="First and last name" autocomplete="off" autocapitalize="words" spellcheck="false" style="border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;min-height:42px"></label>` : ""}
      <label class="small" style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="bTown" ${st.town ? "checked" : ""}> Show the city in the title${towns.length > 1 ? ` <span class="small">(${bEsc(towns.join(", "))})</span>` : ""}</label>
      <div class="offbox" style="margin-top:8px"><span class="small">${st.rows.length > 1 ? "They will read" : "It will read"}</span><br><b id="bTitleP">${[...new Set(st.rows.map(r => bEsc(titleFor(r))))].join("<br>")}</b></div>
      ${msg ? `<p style="color:var(--red-ink)"><b>${bEsc(msg)}</b></p>` : ""}
      <p class="small" style="margin-top:10px">Saving puts ${st.rows.length > 1 ? "them" : "it"} on your Lunches list and in Plan my week. From the list, each one opens in Outlook with the time, place${st.who.length ? " and the people you picked" : ""} filled in, and you tap Send there.</p>
      ${ed ? "" : (() => { const today = bIso(new Date()), mine = bookingsAll().map((b,i) => [b,i]).filter(([b]) => b.date >= today && (b.docs || []).includes(docId));
        return mine.length ? `<p style="margin-top:14px"><b style="color:var(--ink)">Already booked</b> <span class="small">· removing one here only takes it out of Plan my week. Cancel it in Outlook too.</span></p>${mine.map(([b,i]) => `<div class="logday" style="margin-top:4px;gap:8px;flex-wrap:wrap"><span>${bEsc(new Date(b.date + "T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))} · ${bEsc(b.time)} · ${bEsc(b.title)}</span><button type="button" class="btn small" data-bedit="${bEsc(b.id)}">Change</button><button type="button" class="btn small ghost" data-bdrop="${i}">Remove</button></div>`).join("")}` : ""; })()}
      <div class="foot"><button class="btn" id="bX">Cancel</button><button class="btn primary" id="bGo">${ed ? "Save changes" : "Save" + (st.rows.length > 1 ? " " + st.rows.length : "")}</button></div>`);
    const sync = () => {
      $("sheet").querySelectorAll("[data-br]").forEach(el => { const r = st.rows[+el.dataset.br]; r.date = el.querySelector("[data-bdate]").value; r.time = el.querySelector("[data-btime]").value || r.time; r.mins = +el.querySelector("[data-bmins]").value || 60;
        r.kind = el.querySelector("[data-bkind]").value; const of = el.querySelector("[data-boff]"); if (of) r.k = of.value; });
      st.docs = [...$("sheet").querySelectorAll("[data-bd]:checked")].map(c => c.dataset.bd);
      st.who = [...$("sheet").querySelectorAll("[data-bw]:checked")].map(c => c.dataset.bw);
      st.remind = $("bRem").value;
      st.town = $("bTown").checked;
    };
    $("bTown").onchange = () => { sync(); draw(); };
    $("bAddHcp").oninput = () => { const q = $("bAddHcp").value.trim().toUpperCase(); const box = $("bAddSug");
      if (q.length < 2){ box.innerHTML = ""; return; }
      const hits = (bTracker().doctors || []).filter(d => !here.includes(d.id) && (d.name.includes(q) || String(d.city || "").toUpperCase().includes(q))).slice(0, 6);
      box.innerHTML = hits.map(d => `<button type="button" class="cand" data-bxadd="${bEsc(d.id)}" style="width:100%;text-align:left;display:block"><b>${bEsc(bTitle(d.name))}</b> <span class="small">· ${bEsc(bTitle(d.city || ""))}</span></button>`).join("") || `<p class="small">No one by that name on your list.</p>`;
      box.querySelectorAll("[data-bxadd]").forEach(b => b.onclick = () => { sync(); st.extra.push(b.dataset.bxadd); st.docs.push(b.dataset.bxadd); draw(); }); };
    // a new kind on a date moves its time to that kind's usual time, unless you'd changed the time
    $("sheet").querySelectorAll("[data-bkind]").forEach(s => s.onchange = () => { const r = st.rows[+s.closest("[data-br]").dataset.br]; const old = (BOOK_KINDS.find(k => k[0] === r.kind) || [])[1]; sync(); if (r.time === old) r.time = (BOOK_KINDS.find(k => k[0] === r.kind) || [])[1] || r.time; draw(); });
    $("sheet").querySelectorAll("[data-boff]").forEach(s => s.onchange = () => { sync(); draw(); });
    if ($("bAddDate")) $("bAddDate").onclick = () => { sync(); const last = st.rows[st.rows.length-1]; let d = last.date ? new Date(last.date + "T12:00") : new Date(); d.setDate(d.getDate() + 7); st.rows.push({date: bIso(d), time: last.time, mins: last.mins, kind: last.kind, k: last.k}); draw(); };
    $("sheet").querySelectorAll("[data-brm]").forEach(b => b.onclick = () => { sync(); st.rows.splice(+b.dataset.brm, 1); draw(); });
    $("bPeople").onclick = () => { sync(); openInvitees(() => { const nv = invAll(); v.people = nv.people; v.me = nv.me; st.who = st.who.filter(e => nv.people.some(p => p.email === e)).concat(nv.people.filter(p => p.cp && !st.who.includes(p.email)).map(p => p.email)); draw(); }); };
    if ($("bMe")) $("bMe").oninput = () => { const n = staffName($("bMe").value); if (n !== $("bMe").value) $("bMe").value = n; me = n.trim(); $("bTitleP").innerHTML = [...new Set(st.rows.map(r => bEsc(titleFor(r))))].join("<br>");
      try { const r = bRouter(); r.settings = Object.assign(r.settings || {}, {myName: me}); localStorage.setItem("weekrouter.v1", JSON.stringify(r)); } catch(e){}
      try { if (typeof S === "object" && S && S.settings) S.settings.myName = me; } catch(e){} };
    // a booking made earlier: its Outlook links and calendar file again (no second booking is added)
    $("sheet").querySelectorAll("[data-bedit]").forEach(b => b.onclick = () => openBook(docId, back, {edit: b.dataset.bedit}));
    $("sheet").querySelectorAll("[data-bdrop]").forEach(b => b.onclick = () => { sync(); bookingsDrop(+b.dataset.bdrop); toast("Removed from Plan my week"); draw(); });
    $("bX").onclick = () => back ? back() : closeSheet();
    $("bGo").onclick = () => {
      sync();
      if (!me) return draw("Add your name so the title reads the right way.");
      if (!st.docs.length) return draw("Pick at least one HCP.");
      if (st.rows.some(r => !r.date || !r.time)) return draw("Every date needs a day and a time.");
      const nv = invAll(); const ppl = nv.people.filter(p => st.who.includes(p.email));
      const rows = st.rows.map(r => { const o = offOf(r.k); return {date:r.date, time:r.time, mins:r.mins, kind:r.kind, title: titleFor(r), loc: o ? o.a : ""}; });
      const ics = bookingICS(rows, null, null, ppl, nv.me, me, st.remind);
      if (ed){ const r = rows[0];
        bookingsSet(ed.id, {date:r.date, time:r.time, mins:r.mins, kind:r.kind, docs:st.docs.slice(), title:r.title, loc:r.loc, who:ppl.map(p => p.email), remind: st.remind, sent:null});
        const known = id => st.rows.some(rr => (all[id] || []).some(o => o.k === rr.k)); st.rows.forEach(rr => lxAdd(rr.k, st.docs.filter(id => id !== docId && !known(id))));
        openLunches(opt.after || back, ed.sent ? "Changed. Send the new one from Outlook, and cancel the old invite there." : "Changed. Tap Open in Outlook to send it.");
        return; }
      const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
      bookingsAdd(rows.map((r, i) => ({id: nid(), date:r.date, time:r.time, mins:r.mins, kind:r.kind, docs:st.docs.slice(), title:r.title, loc:r.loc, who:ppl.map(p => p.email), remind: st.remind, sent:null})));
      // HCPs added to this lunch by hand are remembered at that office for next time
      const known = id => st.rows.some(r => (all[id] || []).some(o => o.k === r.k));
      st.rows.forEach(r => lxAdd(r.k, st.docs.filter(id => id !== docId && !known(id))));
      openLunches(back, `Saved ${rows.length > 1 ? rows.length + " " : ""}${rows.length > 1 ? "bookings" : "it"}. Nothing is sent yet: tap Open in Outlook for ${rows.length > 1 ? "each one" : "it"} below.`);
    };
  };
  draw();
}
/* sending the invites: each event opens in Outlook on the web with the title, time, place and invitees already filled in.
   Tapping Send there puts it on your calendar and sends the real invites from your account. */
function bTz(d){ const o = -d.getTimezoneOffset(), a = Math.abs(o); return (o >= 0 ? "+" : "-") + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0"); }
function bOutlookLink(r, ppl){
  const [y,m,d] = r.date.split("-").map(Number), [hh,mm] = r.time.split(":").map(Number);
  const s = new Date(y, m-1, d, hh, mm), en = new Date(s.getTime() + r.mins * 60000);
  const iso = dt => bIso(dt) + "T" + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0") + ":00" + bTz(dt);
  const q = new URLSearchParams({subject:r.title, startdt:iso(s), enddt:iso(en), location:r.loc || "", body:""});
  if (ppl.length) q.set("to", ppl.map(p => p.email).join(","));
  return "https://outlook.office.com/calendar/0/deeplink/compose?" + q.toString().replace(/\+/g, "%20");
}
function bSend(rows, ppl, remind, asFile, back){
  const done = new Set();
  const draw = () => openSheet(`<h2>Send ${rows.length > 1 ? "the invites" : "the invite"}</h2>
    <p>Tap each one. Outlook opens with everything filled in${ppl.length ? `, including ${bEsc(ppl.map(p => p.name).join(", "))}` : ""}. Check it and tap <b>Send</b>${ppl.length ? "" : " (or Save)"}: it goes on your calendar${ppl.length ? " and the invites go out from your account" : ""}.</p>
    ${rows.map((r, i) => `<div class="offbox" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <span><b style="color:var(--ink)">${bEsc(r.title)}</b><br><span class="small">${bEsc(new Date(r.date + "T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}))} · ${bEsc(r.time)}${r.loc ? " · " + bEsc(r.loc) : ""}</span></span>
      <a class="btn${done.has(i) ? "" : " primary"}" data-bsend="${i}" href="${bEsc(bOutlookLink(r, ppl))}" target="_blank" rel="noopener">${done.has(i) ? "✓ Opened · open again" : "Open in Outlook"}</a></div>`).join("")}
    <p class="small" style="margin-top:12px">Signed out of Outlook in the browser? Sign in once with your work account. Prefer a calendar file instead? <a href="#" id="bAsFile">Add to my calendar as a file</a> (invites then need to be added in Outlook).</p>
    <div class="foot"><button class="btn primary" id="bDone">Done</button></div>`);
  draw();
  const wire = () => {
    document.querySelectorAll("[data-bsend]").forEach(a => a.addEventListener("click", () => { done.add(+a.dataset.bsend); setTimeout(() => { draw(); wire(); }, 300); }));
    document.getElementById("bAsFile").onclick = e => { e.preventDefault(); asFile(); };
    document.getElementById("bDone").onclick = () => { closeSheet(); toast(done.size ? "Booked. Plan my week has it too." : "Saved in Plan my week. Open each one in Outlook to send."); };
  };
  wire();
}
function bookingICS(rows, title, loc, ppl, myEmail, myName, remind){
  const e = s => String(s || "").replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1").replace(/\n/g,"\\n");
  const fold = l => { const out = []; while (l.length > 74){ out.push(l.slice(0, 74)); l = " " + l.slice(74); } out.push(l); return out.join("\r\n"); };
  const stamp = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Call Tracker//Book//EN","METHOD:PUBLISH","CALSCALE:GREGORIAN"];
  rows.forEach((r, i) => {
    const [y,m,d] = r.date.split("-").map(Number), [hh,mm] = r.time.split(":").map(Number);
    const s = new Date(y, m-1, d, hh, mm), en = new Date(s.getTime() + r.mins * 60000);
    const z = dt => dt.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
    L.push("BEGIN:VEVENT", "UID:" + Date.now().toString(36) + "-" + i + "-" + Math.random().toString(36).slice(2,8) + "@calltracker", "DTSTAMP:" + stamp,
      "DTSTART:" + z(s), "DTEND:" + z(en), "SUMMARY:" + e(r.title || title));
    if (r.loc || loc) L.push("LOCATION:" + e(r.loc || loc));
    if (ppl.length) L.push("DESCRIPTION:" + e("Invite: " + ppl.map(p => p.name + " <" + p.email + ">").join(", ")));
    // the people are on the event too, so Outlook can show them as invitees; tapping Send there sends the invites
    if (ppl.length && myEmail){ L.push("ORGANIZER;CN=" + e(myName || myEmail) + ":mailto:" + myEmail);
      ppl.forEach(p => L.push("ATTENDEE;CN=" + e(p.name) + ";ROLE=REQ-PARTICIPANT;PARTSTAT=NEEDS-ACTION;RSVP=TRUE:mailto:" + p.email)); }
    L.push("STATUS:CONFIRMED", "TRANSP:OPAQUE");
    if (remind) L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + e(r.title || title),"TRIGGER:-" + remind,"END:VALARM");
    L.push("END:VEVENT");
  });
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n");
}
async function bShare(ics, name, n){
  const f = new File([ics], name, {type:"text/calendar"});
  try { if (navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); closeSheet(); toast(n > 1 ? `${n} events ready. In Outlook, open the file and tap Add all.` : "Event ready. In Outlook, open the file and tap Add all."); return; } }
  catch(err){ if (err && err.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  closeSheet(); toast("Saved the file. Open it in Outlook and tap Add all.");
}

/* ---------- the quarter: pace by field days (weekends, holidays and your time off don't count) ---------- */
const qEndOf = iso => { const d = fromISO(iso); return isoDay(new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3 + 3, 0)); };
const qStartOf = iso => { const d = fromISO(iso); return isoDay(new Date(d.getFullYear(), Math.floor(d.getMonth()/3)*3, 1)); };
const plusDays = (iso, n) => { const d = fromISO(iso); d.setDate(d.getDate() + n); return isoDay(d); };
// the same common holidays Plan my week skips (a weekend date moves to the Friday or Monday off)
function holidaysOfYear(y){
  const nth = (m, wd, n) => { const d = new Date(y, m, 1); const off = (wd - d.getDay() + 7) % 7; return new Date(y, m, 1 + off + 7 * (n - 1)); };
  const last = (m, wd) => { const d = new Date(y, m + 1, 0); return new Date(y, m, d.getDate() - ((d.getDay() - wd + 7) % 7)); };
  const obs = d => { const w = d.getDay(); return w === 6 ? new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1) : w === 0 ? new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1) : d; };
  const tg = nth(10, 4, 4);
  return [obs(new Date(y,0,1)), nth(0,1,3), nth(1,1,3), last(4,1), obs(new Date(y,5,19)), obs(new Date(y,6,4)), nth(8,1,1), tg, new Date(y,10,tg.getDate()+1),
    obs(new Date(y,11,24)), obs(new Date(y,11,25)), obs(new Date(y,11,31))].map(isoDay);
}
function quarterPace(){
  const {C, A} = totals(); if (!A) return null;
  const st = routerRaw().settings || {}, t = todayISO();
  const end = state.planEnd && state.planEnd >= t ? state.planEnd : qEndOf(t), start = qStartOf(end);
  const wd = st.workDays || [1,2,3,4,5], hol = st.holidays !== false, offs = st.timeOff || [], H = {};
  const field = iso => { if (!wd.includes(fromISO(iso).getDay())) return false;
    if (hol){ const y = iso.slice(0,4); H[y] = H[y] || new Set(holidaysOfYear(+y)); if (H[y].has(iso)) return false; }
    return !offs.some(r => iso >= r.from && iso <= (r.to || r.from)); };
  let total = 0, past = 0; for (let d = start; d <= end; d = plusDays(d, 1)) if (field(d)){ total++; if (d < t) past++; }
  const left = Math.max(0, total - past), goal = Math.max(0.3, Math.min(1, (+st.goal || 100) / 100));
  const T = Math.round(A * goal), toGo = Math.max(0, T - C), perDay = +st.perDay || 6;
  const need = left ? toGo / left : (toGo ? Infinity : 0);
  const behind = (T * past / Math.max(1, total) - C) / perDay;   // in field days; negative means ahead
  const reach = Math.min(100, Math.round((C + left * perDay * 0.85) / A * 100));
  const extraWk = Math.ceil((need - perDay) * wd.length);   // calls a week beyond your usual days
  let tone = "ok", say;
  if (!toGo) say = "Quarter goal reached";
  else if (need <= perDay) say = "On track";
  else if (need <= perDay * 1.25){ tone = "amb"; say = `About ${extraWk} extra call${extraWk === 1 ? "" : "s"} a week`; }
  else { tone = "amb"; say = `Your usual days reach about ${reach}%`; }
  return {C, A, T, goal, toGo, left, total, past, perDay, need, behind, reach, end, tone, say, extraWk};
}
const perDayTxt = n => n === Infinity ? "—" : (Math.round(n * 10) / 10).toString();
function renderQuarter(){

  $("qLbl").textContent = `This quarter · ${p.left} field day${p.left === 1 ? "" : "s"} left`;
  $("qBig").textContent = `${p.C} of ${p.T} calls done`;
  $("qLine").innerHTML = p.toGo ? `<b>${p.toGo}</b> to go · about <b>${perDayTxt(p.need)} a day</b> · you plan ${p.perDay} a day` : "You've made every call your goal needs. Calls from here are extra.";
  $("qStat").className = "qstat " + p.tone; $("qStat").textContent = p.say;
  const pct = Math.min(100, Math.round(p.C / Math.max(1, p.T) * 100));
  $("qRing").style.setProperty("--p", pct); $("qPct").textContent = pct + "%";
}

  openSheet(`<h2>Your pace</h2>

const US_STATES = {AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",DC:"District of Columbia",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",PR:"Puerto Rico",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming"};
function stateOfZip(zip){ const m = String(zip || "").match(/\b(\d{5})(?:-\d{4})?\b/); if (!m) return null; const n = +m[1].slice(0, 3); const r = GEO_ZIP3.find(x => n >= x[0] && n <= x[1]); return r ? r[2] : null; }
function zipIn(s){ const m = String(s || "").match(/\b(\d{5})(?:-\d{4})?\s*$/); return m ? m[1] : ""; }
function geoStates(){ try { const l = JSON.parse(localStorage.getItem(GEO_KEY)); return Array.isArray(l) ? l.filter(s => US_STATES[s]) : []; } catch(e){ return []; } }
function geoSetStates(l){ try { localStorage.setItem(GEO_KEY, JSON.stringify([...new Set(l)].filter(s => US_STATES[s]))); } catch(e){} }
const geoLoaded = new Set(), geoTried = new Set();
const geoUrl = st => new URL((location.pathname.includes("/route/") ? "../geo/" : "geo/") + st + ".json", location.href).href;
async function geoFetch(st){
  const url = geoUrl(st); let c = null; try { c = await caches.open(GEO_CACHE); } catch(e){}
  let res = c ? await c.match(url) : null;
  if (!res){ res = await fetch(url, {cache:"no-cache"}); if (!res.ok) throw new Error("no file for " + st); if (c) await c.put(url, res.clone()); }
  return res.json();
}
// load the states chosen in Settings (remembered on this iPad)
async function geoLoad(apply){
  const sts = geoStates();
  for (const st of sts){ if (geoLoaded.has(st)) continue; try { apply(await geoFetch(st)); geoLoaded.add(st); } catch(e){} }
}
// make sure these states are loaded; resolves true when something new arrived
async function geoEnsure(states, apply){
  const need = [...new Set(states)].filter(s => s && US_STATES[s] && !geoLoaded.has(s) && !geoTried.has(s)); if (!need.length) return false;
  let got = false;
  for (const st of need){ geoTried.add(st); try { apply(await geoFetch(st)); geoLoaded.add(st); geoSetStates(geoStates().concat(st)); got = true; } catch(e){ geoTried.delete(st); } }
  return got;
}
// Type-ahead for a town: suggestions appear right under the box as you type (start of the name first, then a word in it,
// then close spellings like "Concrd"). Tapping one fills the box. Works the same on every iPad, unlike a datalist.
function cityAhead(inp, getList, getMine){
  if (!inp || inp.dataset.ahead) return; inp.dataset.ahead = "1"; inp.removeAttribute("list");
  const box = document.createElement("div"); box.className = "cityahead";
  box.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:6px";
  inp.insertAdjacentElement("afterend", box);
  const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const near = (a, b) => { if (Math.abs(a.length - b.length) > 2) return 9; const d = []; for (let i = 0; i <= a.length; i++){ d[i] = [i]; for (let j = 1; j <= b.length; j++) d[i][j] = i ? Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)) : j; } return d[a.length][b.length]; };
  const show = () => {
    const q = norm(inp.value); if (!q){ box.innerHTML = ""; return; }
    const list = [...new Set(getList())];
    if (list.some(c => norm(c) === q)){ box.innerHTML = ""; return; }
    const rank = c => { const n = norm(c); if (n.startsWith(q)) return 0; if (n.split(" ").some(w => w.startsWith(q))) return 1; if (q.length >= 3 && n.includes(q)) return 2;
      if (q.length >= 4){ const e = Math.min(near(q, n), near(q, n.slice(0, q.length))); if (e <= (q.length >= 7 ? 2 : 1)) return 3 + e; } return 99; };
    // your own towns (where your doctors are) first; close spellings only when nothing starts that way
    const mine = new Set((getMine ? getMine() : []).map(norm));
    let hits = list.map(c => [c, rank(c)]).filter(x => x[1] < 99).map(x => [x[0], x[1] - (mine.has(norm(x[0])) ? 0.5 : 0)]);
    if (hits.some(x => x[1] < 3)) hits = hits.filter(x => x[1] < 3);
    hits = hits.sort((a,b) => a[1] - b[1] || a[0].localeCompare(b[0])).slice(0, 6);
    box.innerHTML = hits.length ? (hits[0][1] >= 3 ? `<span style="font-size:13px;opacity:.75;align-self:center">Did you mean</span>` : "") + hits.map(([c]) => `<button type="button" class="chip" data-ca="${String(c).replace(/"/g, "&quot;")}" style="min-height:36px">${String(c).replace(/</g, "&lt;")}</button>`).join("")
      : `<span style="font-size:13px;opacity:.75">No town by that name${list.length ? "" : " yet. Choose your state first"}.</span>`;
    box.querySelectorAll("[data-ca]").forEach(b => b.onclick = () => { inp.value = b.dataset.ca; box.innerHTML = ""; inp.dispatchEvent(new Event("change", {bubbles:true})); });
  };
  inp.addEventListener("input", show); inp.addEventListener("focus", show);
}
