function weekStartISO(iso){ const d = fromISO(iso); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return isoDay(d); }
function routingRows(){
  const t = todayISO(), wk = weekStartISO(t);
  const end = state.planEnd && state.planEnd >= t ? state.planEnd : null;
  const weeksLeft = end ? Math.max(1, Math.ceil((Math.round((fromISO(end)-fromISO(t))/864e5)+1)/7)) : null;
  const rows = state.doctors.filter(d => rem(d) > 0).map(d => {
    const lc = lastCall(d), r = rem(d);
    return { name:d.name, city:d.city, completed:done(d), assigned:d.a, remaining:r,
      lastCall: lc, daysSinceLastCall: lc ? daysAgo(lc) : null,
      callsThisWeek: d.log.filter(x => x >= wk && x <= t).length,
      callsPerWeekNeeded: weeksLeft ? Math.round(r/weeksLeft*100)/100 : null,
      status: status(d)==="red" ? "More than half left" : "Half or less left",
      _share: d.a ? r/d.a : 0 };
  });
  // Most behind first: calls/week needed (or share of plan left), then longest since last call
  rows.sort((a,b) => ((b.callsPerWeekNeeded ?? b._share) - (a.callsPerWeekNeeded ?? a._share))
    || ((b.daysSinceLastCall ?? 9999) - (a.daysSinceLastCall ?? 9999)) || a.name.localeCompare(b.name));
  rows.forEach((r,i) => { r.priority = i+1; delete r._share; });
  return {rows, weeksLeft, end};
}

function routingCSV(rows){

  const body = rows.map(r => [r.priority,r.name,r.city,r.completed,r.assigned,r.remaining,r.lastCall||"",r.daysSinceLastCall??"",r.callsThisWeek,r.callsPerWeekNeeded??"",r.status].map(csvCell).join(","));
  return [head.join(","), ...body].join("\n");
}

function parseCallPlanText(text){
  const JUNK_LEAD = /^([^A-Z]{1,3}|[A-Z]|O|Oo|0|\(\)|\[\]|©|@|®|&)$/;
  const DATE = /^\d{1,2}\/\d{1,2}\/\d{2,4}[.,]?$/;

  const rows = []; let total = null;
  for (let raw of text.split(/\n+/)){
    const line = raw.replace(/[|‘’`“”"]/g," ").replace(/\s+/g," ").trim();
    if (!line) continue;
    const tm = line.match(/^tota[l1I]\W*\s*(\d+)\s+(.*)$/i);
    if (tm){ const nums = (tm[2].match(/\d+/g)||[]).map(Number); if (nums.length>=3) total = {count:+tm[1], c:nums[0], a:nums[1], r:nums[2]}; continue; }
    // the total row with a misread label ("ae 97 67 251 184"): four numbers where completed + remaining = assigned
    const tm2 = line.match(/^\W*[A-Za-z]{0,6}\W*\s+(\d{1,3})\s+(\d{1,4})\s+(\d{1,4})\s+(\d{1,4})\W*$/);
    if (tm2 && +tm2[2] + +tm2[4] === +tm2[3] && +tm2[3] >= +tm2[1]){ total = {count:+tm2[1], c:+tm2[2], a:+tm2[3], r:+tm2[4]}; continue; }
    let tok = line.split(" ");
    // find where product/sales text begins
    let p = tok.findIndex(t => PRODUCTISH.test(t));
    // a product name made of two words ("NAME WORD-Primary"): the plain word just before belongs to it too, when numbers come before it
    if (p >= 2 && /^[A-Za-z]{3,}$/.test(tok[p-1]) && /\d/.test(tok[p-2])) p--;
    if (p < 2) continue;
    const head = tok.slice(0,p), tail = tok.slice(p);
    // SD1 A: first standalone number after the product text
    const tailNums = tail.join(" ").replace(/^.*?(SECONDARY|PRIMARY)\S*/i,"").match(/\b\d{1,2}\b/g);
    let sdA = tailNums ? +tailNums[0] : null;
    if (sdA === 0) sdA = null;
    // split head into identity part and the C/A/R cluster
    let di = head.findIndex(t => DATE.test(t));
    let ident, cluster;
    let last = null;
    if (di >= 0){ ident = head.slice(0,di); cluster = head.slice(di+1);
      const dm = head[di].match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (dm){ const y = dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]; if (+dm[1] >= 1 && +dm[1] <= 12 && +dm[2] >= 1 && +dm[2] <= 31) last = y + "-" + String(dm[1]).padStart(2,"0") + "-" + String(dm[2]).padStart(2,"0"); } }
    else {
      // no date: cluster = trailing tokens that contain digits or look like OCR noise
      let k = head.length;
      while (k>0 && /\d|^[OoQ]\W*$|^\W+$/.test(head[k-1]) && head.length-k < 6) k--;
      ident = head.slice(0,k); cluster = head.slice(k);
    }
    // identity: strip leading junk (checkbox), and non-word dashes
    ident = ident.map(t => t.replace(/!$/,"I").replace(/^!/,"I")).map(t => t.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"")).filter(Boolean);
    while (ident.length > 2 && (ident[0].length===1 || (ident[0].length===2 && /[OQ0]/i.test(ident[0])) || /^(IF|TI|II|IT|IO|OI|HI|LS|IE|IG|IL|EI|IS|SI|GI|FI|LL|II|EE)$/i.test(ident[0]))) ident.shift();
    ident = ident.filter(t => /^[A-Za-z][A-Za-z'\-]*$/.test(t)).map(t=>t.toUpperCase());
    if (ident.length < 2) continue;
    // Target name is followed by its Last Name column: find the repeat
    let name=null, city="";
    // the Last Name column can be misread by a letter ("MORALES MORALE") or glued ("DE LEON DELEON")
    const near = (x, y) => { if (x === y) return true; if (Math.min(x.length, y.length) < 4 || Math.abs(x.length - y.length) > 1) return false;
      let i = 0; while (i < x.length && x[i] === y[i]) i++; const a2 = x.slice(i), b2 = y.slice(i);
      return a2.slice(1) === b2.slice(1) || a2.slice(1) === b2 || a2 === b2.slice(1); };
    for (let s=ident.length-1; s>=1 && !name; s--){
      for (let m=Math.min(3,s); m>=1; m--){
        if (s+m <= ident.length && ident.slice(s,s+m).join(" ")===ident.slice(s-m,s).join(" ")){
          name = ident.slice(0,s).join(" "); city = ident.slice(s+m).join(" "); break;
        }
      }
      if (!name) for (let m=Math.min(3,s); m>=2; m--){
        if (s-m >= 1 && ident[s] === ident.slice(s-m,s).join("")){ name = ident.slice(0,s).join(" "); city = ident.slice(s+1).join(" "); break; }
      }
      if (!name && s >= 2 && near(ident[s], ident[s-1])){ name = ident.slice(0,s).join(" "); city = ident.slice(s+1).join(" "); }
      // OCR sometimes glues a short name together: "JOHNDOE DOE" -> "JOHN DOE"
      if (!name && ident[s].length>=2 && ident[s-1].length>ident[s].length+1 && ident[s-1].endsWith(ident[s])){
        const first = ident[s-1].slice(0, ident[s-1].length-ident[s].length);
        name = [...ident.slice(0,s-1), first, ident[s]].join(" "); city = ident.slice(s+1).join(" ");
      }
    }
    if (!name) continue;
    // numbers
    let digits = cluster.join(" ").replace(/[Oo]/g,"0").replace(/[^0-9]/g,"");
    let c=null,a=null,r=null,sure=false;
    if (digits.length===3){ const [x,y,z]=digits.split("").map(Number); if (x+z===y){ c=x;a=y;r=z;sure=true; } }
    if (!sure && digits.length>=4 && sdA!=null){
      // two-digit values possible (A>=10): try parses
      const cands=[]; const d=digits;
      for (let i=1;i<d.length;i++) for (let j=i+1;j<d.length;j++){
        const x=+d.slice(0,i), y=+d.slice(i,j), z=+d.slice(j);
        if (x+z===y && y===sdA && String(+d.slice(0,i))===d.slice(0,i)) cands.push([x,y,z]);
      }
      if (cands.length===1){ [c,a,r]=cands[0]; sure=true; }
    }
    if (!sure){
      const d = digits.split("").map(Number);
      if (sdA!=null){
        a = sdA; const last = d.length ? d[d.length-1] : null;
        if (last!=null && last<=a){ r=last; c=a-last; } else { c=0; r=a; }
      } else if (d.length>=3){ c=d[0]; r=d[d.length-1]; a=c+r; }
      else if (d.length===2){ a=d[0]; r=Math.min(d[1],a); c=a-r; }
      else if (d.length===1){ a=d[0]; r=a; c=0; }
    }
    if (a==null) continue;
    rows.push({name, city, c, a, r, last, guess: !sure && (sdA==null || digits.length <= 1)});
  }
  return {rows, total};
}


function simdSupported(){
  try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11])); } catch(e){ return false; }
}
const CORE_FILE = simdSupported() ? "tesseract-core-simd-lstm.wasm.js" : "tesseract-core-lstm.wasm.js";
async function vendorBlob(url){
  // cache-first from this device's storage; network only the first time
  let res = null;
  try { const c = await caches.open(VCACHE); res = await c.match(url);
        if (!res){ const net = await fetch(url, {mode:"cors"}); if (!net.ok) throw new Error("download failed"); await c.put(url, net.clone()); res = net; } }
  catch(e){ if (!res){ const net = await fetch(url, {mode:"cors"}); if (!net.ok) throw e; res = net; } }
  return URL.createObjectURL(await res.blob());
}
async function ocrReady(){
  try { const c = await caches.open(VCACHE);
    return !!(await c.match(TJS+"tesseract.min.js")) && !!(await c.match(TJS+"worker.min.js")) && !!(await c.match(CORE+CORE_FILE)) && localStorage.getItem("calltracker.langReady")==="1";
  } catch(e){ return false; }
}
let ocrWorker = null;
async function getWorker(onProgress){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract){
    const src = await vendorBlob(TJS+"tesseract.min.js");
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("engine")); document.head.appendChild(s); });
  }
  const workerPath = await vendorBlob(TJS+"worker.min.js");
  const corePath = (await vendorBlob(CORE+CORE_FILE)) + "#core.js";
  ocrWorker = await Tesseract.createWorker("eng", 1, {
    workerPath, corePath, langPath: LANG, workerBlobURL: false, cacheMethod: "write",
    logger: m => onProgress && onProgress(m)
  });
  await ocrWorker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "0" });
  try { localStorage.setItem("calltracker.langReady","1"); } catch(e){}
  return ocrWorker;
}

/* ---------- your two reports ----------
   1. The assigned calls report (Excel): each HCP's assigned calls for the quarter (Pre Calls), priorities, type, specialty, office.
   2. The attainment report (as often as you like): the percent of each HCP's assigned calls done. Done = percent × assigned; left = assigned − done.
   Attainment never goes over 100%, so no HCP counts for more than their assigned calls. */
async function xInflateRaw(u8){ if (typeof DecompressionStream === "undefined") throw new Error("This iPad's software is too old to open .xlsx files (it needs iPadOS 16.4 or newer). Update the iPad, or save the spreadsheet as a .csv file and load that instead.");
  const ds = new DecompressionStream("deflate-raw"); return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer(); }
async function readXlsxT(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), td = new TextDecoder();

  if (e < 0) throw new Error("That file isn't an Excel .xlsx file.");
  const n = dv.getUint16(e+10, true); let off = dv.getUint32(e+16, true); const files = {};
  for (let i=0;i<n;i++){
    const method = dv.getUint16(off+10,true), csize = dv.getUint32(off+20,true), nl = dv.getUint16(off+28,true), xl = dv.getUint16(off+30,true), cl = dv.getUint16(off+32,true), lho = dv.getUint32(off+42,true);
    files[td.decode(u8.subarray(off+46, off+46+nl))] = {method, csize, lho}; off += 46+nl+xl+cl;
  }
  const get = async name => { const f = files[name]; if (!f) return null; const l = f.lho, s = l+30+dv.getUint16(l+26,true)+dv.getUint16(l+28,true); const data = u8.subarray(s, s+f.csize);
    return td.decode(f.method === 0 ? data : new Uint8Array(await xInflateRaw(data))); };
  const xml = s => new DOMParser().parseFromString(s, "application/xml");
  const ssx = await get("xl/sharedStrings.xml");
  const shared = ssx ? [...xml(ssx).getElementsByTagName("si")].map(si => [...si.getElementsByTagName("t")].map(t => t.textContent).join("")) : [];
  const wb = xml(await get("xl/workbook.xml")), rels = xml(await get("xl/_rels/workbook.xml.rels"));
  const relMap = {}; [...rels.getElementsByTagName("Relationship")].forEach(r => relMap[r.getAttribute("Id")] = r.getAttribute("Target"));
  const sheets = [...wb.getElementsByTagName("sheet")].map(s => ({name:s.getAttribute("name"), target: relMap[s.getAttribute("r:id")] || relMap[s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id")]}));
  const out = [];
  for (const sh of sheets){
    let path = String(sh.target||"").replace(/^\//,""); if (!path.startsWith("xl/")) path = "xl/" + path;
    const sx = await get(path); if (!sx) continue;
    const rows = [];
    [...xml(sx).getElementsByTagName("row")].forEach(r => {
      const ri = +r.getAttribute("r") - 1; const row = [];
      [...r.getElementsByTagName("c")].forEach(c => {
        const ref = c.getAttribute("r") || ""; let ci = 0; for (const ch of ref.replace(/\d+/g,"")) ci = ci*26 + (ch.charCodeAt(0)-64); ci--;
        const t = c.getAttribute("t"), v = c.getElementsByTagName("v")[0], is = c.getElementsByTagName("is")[0];
        let val = v ? v.textContent : (is ? [...is.getElementsByTagName("t")].map(x => x.textContent).join("") : "");
        if (t === "s") val = shared[+val] ?? "";
        const fm = c.getElementsByTagName("f")[0]; if (fm && t !== "s" && t !== "str" && !v) val = "=" + fm.textContent;
        row[ci] = val;
      });
      rows[ri] = row;
    });
    out.push({name: sh.name, rows: rows.map(r => r || [])});
  }
  return out;
}

const TRK_ROUTER_KEYS = ["weekrouter.v1", "bookings.v1", "doctor.offices.v1"];
// a doctor's name corrected by the report: carry everything kept under the old name over to the right one
function renameDocEverywhere(oldId, newId){
  if (!oldId || oldId === newId) return;
  const walk = v => { if (Array.isArray(v)) return v.map(walk); if (v && typeof v === "object"){ const o = {}; for (const k in v) o[k === oldId ? newId : k] = walk(v[k]); return o; } return v === oldId ? newId : v; };
  TRK_ROUTER_KEYS.forEach(k => { try { const raw = localStorage.getItem(k); if (!raw) return; localStorage.setItem(k, JSON.stringify(walk(JSON.parse(raw)))); } catch(e){} });
}
const titleName = s => titleCase(String(s || "").toLowerCase());
// best match for a report name among the doctors you have: same name, same name with spaces or a letter or two off, or first and last swapped
function matchDoc(id, pool){
  const ex = pool.find(d => d.id === id); if (ex) return ex;
  const flat = x => x.replace(/ /g, ""), toks = x => x.split(" ").sort().join(" "), last = x => x.split(" ").pop();
  const hits = pool.filter(d => flat(d.id) === flat(id) || toks(d.id) === toks(id) || (d.id.length >= 7 && editDist(d.id, id) <= 2 && editDist(last(d.id), last(id)) <= 1));
  return hits.length === 1 ? hits[0] : null;
}
function readPlanRows(sheets){
  for (const sh of sheets){
    const rows = sh.rows; const lc = r => (r || []).map(c => String(c ?? "").trim().toLowerCase());
    const hi = rows.findIndex(r => { const l = lc(r); return l.includes("last name") && l.some(x => /^pre calls?$/.test(x)); }); if (hi < 0) continue;
    const H = lc(rows[hi]), col = re => H.findIndex(h => re.test(h));
    const c = {last: col(/^last name$/), first: col(/^first name$/), pre: col(/^pre calls?$/), adr: col(/^address/), city: col(/^city$/), zip: col(/^zip/), type: col(/sub ?type/), spec: col(/spec/)};
    const pr = v => { v = String(v ?? "").trim(); return /^not in seg/i.test(v) ? "Not in segmentation" : v; };
    // priority columns, whatever they're called ("Current ... Priority"); the earlier ("Previous") ones are skipped
    const prCols = H.map((h, i) => /priority/.test(h) && !/previous|prior\b/.test(h) ? i : -1).filter(i => i >= 0);
    const prLabel = i => titleCase(String(rows[hi][i] ?? "").replace(/current|priority/gi, "").replace(/\s+/g, " ").trim().toLowerCase()) || "Priority";
    const out = [];
    rows.slice(hi + 1).forEach(r => { r = r || []; const L = String(r[c.last] ?? "").trim(), F = String(r[c.first] ?? "").trim(); if (!L) return;
      const name = norm(F + " " + L);
      out.push({id: name, name, city: String(r[c.city] ?? "").trim().toUpperCase(), a: Math.max(0, Math.round(+r[c.pre] || 0)),
        prof: {prios: prCols.map(i => ({label: prLabel(i), value: pr(r[i])})).filter(x => x.value), type: String(r[c.type] ?? "").trim(), spec: String(r[c.spec] ?? "").trim(),
          address: titleCase(String(r[c.adr] ?? "").trim().toLowerCase()), city: titleName(r[c.city]), zip: String(r[c.zip] ?? "").trim().slice(0, 5)}}); });
    if (out.length) return out;
  }
  return null;
}

function reviewPlan(rows, fname){

    }

    state.doctors = nextDocs.concat(state.doctors.filter(d => d.added));

// attainment: "ALEX DIAZ (1) ... 67%" per doctor (the Subtotal rows and the total at the top are skipped)
function parseAttainmentText(text){

function missingCands(){

  (state.dropped || []).forEach(d => { if (!have.has(d.id)) out.set(d.id, {...d, from:"dropped"}); });

  const note = (id, city) => { if (id && !have.has(id) && !out.has(id) && !(ids.get(id) || "")) ids.set(id, city || ids.get(id) || ""); };
  for (const w in (r.weeks || {})) for (const iso in r.weeks[w].plan.days) r.weeks[w].plan.days[iso].stops.forEach(s => note(s.id, String(s.addrKey || "").split("|")[1]));

  for (const [id, city] of ids) if (!out.has(id)) out.set(id, {id, name:id, city: titleCase(city || ((offs[id] || [])[0] || {}).a?.split(", ").pop() || ""), from:"router"});

}

    ${list.length ? `<div class="cands" style="margin-top:8px">${list.map((d,i) => `<div class="cand" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span><b>${esc(titleCase(d.name))}</b>${d.city ? ` <span class="small">· ${esc(titleCase(d.city))}</span>` : ""}${d.a ? `<br><span class="small">${d.a} assigned${d.c0 ? ", " + d.c0 + " completed" : ""} when it dropped off</span>` : ""}</span><button class="btn small" data-mb="${i}">Add back</button></div>`).join("")}</div>`
      : `<p style="margin-top:8px"><b>No one found.</b> Compare the HCP count with your report, or load the call plan screenshots again with <b>Update my numbers</b>. It adds anyone missing without touching your logged calls.</p>`}
    <p class="small" style="margin-top:10px">The easiest fix is often to load your call plan screenshots again and tap <b>Update my numbers</b>: the What changed box shows who was missing, and anyone missing is added back.</p>
    <div class="foot"><button class="btn" id="closeS">Close</button></div>`);
  $("closeS").onclick = closeSheet;
  $("sheet").querySelectorAll("[data-mb]").forEach(b => b.onclick = () => openAddBack(list[+b.dataset.mb]));
}
function openAddBack(m){
  openSheet(`<h2>Add back ${esc(titleCase(m.name))}</h2>
    <p>Enter the numbers from your latest report.</p>
    <div class="logday" style="margin-top:8px;flex-wrap:wrap;gap:10px">
      <label class="small">City <input id="abC" value="${esc(titleCase(m.city || ""))}" style="width:160px"></label>
      <label class="small">Assigned <input id="abA" type="number" inputmode="numeric" min="0" value="${m.a || ""}" style="width:80px"></label>
      <label class="small">Completed <input id="abD" type="number" inputmode="numeric" min="0" value="${m.c0 || 0}" style="width:80px"></label></div>
    <p class="small" id="abErr" style="color:var(--red-ink)"></p>
    <div class="foot"><button class="btn" id="abX">Back</button><button class="btn primary" id="abOk">Add to my call plan</button></div>`);
  $("abX").onclick = openMissing;
  $("abOk").onclick = () => {
    const a = Math.max(0, +$("abA").value || 0), c = Math.min(a, Math.max(0, +$("abD").value || 0));
    if (!a){ $("abErr").textContent = "Enter the assigned number from your report."; return; }
    state.doctors.push({id:m.id, name:m.name.toUpperCase(), city:($("abC").value || "").trim().toUpperCase(), c0:c, a, r0:a - c, lastRpt:null, log:[]});
    state.dropped = (state.dropped || []).filter(x => x.id !== m.id);
    save(); render(); closeSheet(); toast(`Added back ${titleCase(m.name)} · ${a - c} left`);
  };
}
/* Maps: directions to today's next stop (only the office address goes to Maps, never a name), or Maps itself */
const isAndroid = () => /Android/i.test(navigator.userAgent);
// on iPad and iPhone, maps:// opens the Maps app itself (a maps.apple.com link can land on the Maps website instead)
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const dirUrl = addr => isAndroid() ? "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(addr) : (isIOS() ? "maps://?daddr=" : "https://maps.apple.com/?daddr=") + encodeURIComponent(addr);
const searchUrl = q => isAndroid() ? "https://www.google.com/maps/search/" + encodeURIComponent(q) : (isIOS() ? "maps://?q=" : "https://maps.apple.com/?q=") + encodeURIComponent(q);
const mapsHome = () => isAndroid() ? "https://www.google.com/maps" : isIOS() ? "maps://" : "https://maps.apple.com/";
// app links open in place; web links in a new tab
const tgt = u => /^https?:/.test(u) ? ' target="_blank" rel="noopener"' : "";
// today's planned stops from Plan my week, in route order, with whether each is already logged today
function stopsToday(){
  try {
    const r = routerRaw(), t = todayISO(), d = new Date(); const mon = isoDay(new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7)));
    const day = r.weeks && r.weeks[mon] && r.weeks[mon].plan.days[t]; if (!day) return [];
    let offs = {}; try { offs = JSON.parse(localStorage.getItem("doctor.offices.v1")) || {}; } catch(e){}
    const am = day.stops.filter(s => s.slot === "am"), pm = day.stops.filter(s => s.slot !== "am");
    return am.concat(pm).map(s => { const doc = find(s.id); const o = (offs[s.id] || []).find(x => x.k === s.addrKey) || (offs[s.id] || [])[0];
      const addr = o && o.a && !/not set yet/.test(o.a) ? o.a : "";
      return {id: s.id, slot: s.slot, k: (o && o.k) || s.addrKey || "", note: (o && o.n) || "", name: doc ? doc.name : s.id, city: addr ? addr.split(", ").pop() : titleCase((doc && doc.city) || ""), addr, done: !!s.done || !!(doc && doc.log.includes(t))}; });
  } catch(e){ return []; }
}
function mapsTile(){ const nx = stopsToday().find(x => !x.done); $("mapNext").textContent = nx ? "Next: " + titleCase(nx.name.split(" ").pop()) : ""; }
$("mapBtn").onclick = () => openMaps();
function openMaps(){
  const st = stopsToday(), nx = st.find(x => !x.done);
  openSheet(`<h2>Maps</h2>
    ${nx ? `<div class="foot" style="justify-content:flex-start;margin-top:8px">${nx.addr ? `<a class="btn primary" href="${esc(dirUrl(nx.addr))}"${tgt(dirUrl(nx.addr))}>➜ Next stop: ${esc(titleCase(nx.name))} · ${esc(nx.city)}</a>` : `<span class="small">Next stop: ${esc(titleCase(nx.name))} · ${esc(nx.city)} (address not set, so no directions)</span>`}</div>` : ""}
    ${st.length ? `<p style="margin-top:14px"><b style="color:var(--ink)">Today's route</b></p><div class="cands">${st.map(x => x.addr && !x.done ? `<a class="cand" style="text-decoration:none;color:inherit;display:flex;justify-content:space-between;gap:8px" href="${esc(dirUrl(x.addr))}"${tgt(dirUrl(x.addr))}><span><b>${esc(titleCase(x.name))}</b><br><span class="small">${esc(x.addr)}</span></span><span class="small" style="align-self:center">Directions ›</span></a>` : `<div class="cand" style="opacity:.6"><b>${esc(titleCase(x.name))}</b> <span class="small">· ${x.done ? "✓ logged today" : esc(x.city) + " · no address yet"}</span></div>`).join("")}</div>` : `<p class="small">No route for today. Build your week in Plan my week to get directions to each stop here.</p>`}
    <p style="margin-top:14px"><b style="color:var(--ink)">Near me</b></p>
    <div class="foot" style="justify-content:flex-start;flex-wrap:wrap"><a class="btn" href="${esc(searchUrl("restaurants"))}"${tgt(searchUrl("x"))}>🍴 Food</a><a class="btn" href="${esc(searchUrl("coffee"))}"${tgt(searchUrl("x"))}>☕ Coffee</a><a class="btn" href="${esc(searchUrl("gas station"))}"${tgt(searchUrl("x"))}>⛽ Gas</a><a class="btn" href="${mapsHome()}"${tgt(mapsHome())}>Open the Maps app</a></div>
    <p class="small" style="margin-top:12px">Opens ${isAndroid() ? "Google" : "Apple"} Maps. Only an office address or your search goes to Maps, never an HCP's name.</p>
    <div class="foot"><button class="btn" id="closeS">Close</button></div>`);
  $("closeS").onclick = closeSheet;
}
/* DoorDash: just opens the app, where your saved addresses already are. Nothing is sent from here. */
$("ddBtn").onclick = () => {
  const t0 = Date.now(); location.href = "doordash://";
  setTimeout(() => { if (!document.hidden && Date.now() - t0 < 3000) window.open("https://www.doordash.com/", "_blank"); }, 1600);
};
/* ---------- Home Screen + offline ---------- */
const APP_SHELL = "calltracker-shell-v62";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
// ask iPadOS to keep this app's data even when the iPad is low on space
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
// a newer version was just downloaded in the background: offer it (the app opens instantly from the saved copy)
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "app-updated" || document.getElementById("updBar")) return;
  if (!ev.data.ver || ev.data.ver === APP_SHELL) return;   // an older helper, or this page already is that version
  let just = 0; try { just = +sessionStorage.getItem("upd.just") || 0; } catch(e){}
  if (Date.now() - just < 60000) return;   // just updated: a late duplicate notice is not news
  const b = document.createElement("button"); b.id = "updBar"; b.type = "button"; b.textContent = "A new version is ready · Tap to update";
  b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh,0px) + 16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2)";
  b.onclick = () => { b.remove(); try { sessionStorage.setItem("upd.just", String(Date.now())); } catch(e){} const c = navigator.serviceWorker.controller; if (c) c.postMessage({type:"update-seen"}); setTimeout(() => location.reload(), 150); }; document.body.appendChild(b);
});
if ("serviceWorker" in navigator) { const ask = () => navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({type:"update?", ver: APP_SHELL}); setTimeout(ask, 1500); setTimeout(ask, 6000); }
// a Home Screen app is often just brought back, not reopened: look for a newer version then too
if ("serviceWorker" in navigator) { let lastChk = Date.now(); document.addEventListener("visibilitychange", () => { if (document.hidden || Date.now() - lastChk < 30000) return; lastChk = Date.now(); navigator.serviceWorker.getRegistration().then(r => r && r.update()).catch(()=>{}); setTimeout(() => navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({type:"update?", ver: APP_SHELL}), 4000); }); }

if (location.hash === "#newq"){ view = "home"; try { history.replaceState(null, "", "#home"); } catch(e){} setTimeout(() => openNewQuarter(), 50); }
try { const hm = sessionStorage.getItem("home.msg"); if (hm){ sessionStorage.removeItem("home.msg"); setTimeout(() => toast(hm), 300); } } catch(e){}
try { const rm = sessionStorage.getItem("restored.msg"); if (rm){ sessionStorage.removeItem("restored.msg"); setTimeout(() => toast(rm), 300); } } catch(e){}
render();
geoLoad(applyGeo);
// "Add Doe" from Plan my week's build check
try { const pend = localStorage.getItem("pending.addProvider"); if (pend){ localStorage.removeItem("pending.addProvider"); let o = {last: pend}; if (pend[0] === "{") o = JSON.parse(pend); o.cal = true; openAddProvider(null, o); } } catch(e){}
