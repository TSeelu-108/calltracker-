<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Call Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f5f7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Call Tracker</title>
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#17202b; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#0f5f8c; --accent-ink:#ffffff; --accent-soft:#e3eff7;
  --red-fill:#fde3e1; --red-edge:#e7a29c; --red-ink:#8f2a22;
  --yel-fill:#fff3c4; --yel-edge:#e3c45a; --yel-ink:#7a5a00;
  --grn-fill:#d9f2de; --grn-edge:#88c997; --grn-ink:#1d6a33;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f141a; --surface:#18202a; --ink:#e7edf3; --muted:#9aa8b6; --line:#2a3542;
  --accent:#5fb3e6; --accent-ink:#06121c; --accent-soft:#1a3244;
  --red-fill:#4a2321; --red-edge:#8a3e38; --red-ink:#ffc9c3;
  --yel-fill:#463b14; --yel-edge:#8c7426; --yel-ink:#ffe69a;
  --grn-fill:#1d3d27; --grn-edge:#3f7d50; --grn-ink:#b8ecc5; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:0 48px}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:1px solid var(--line)}
.row1{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.today .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.today .date{font-family:var(--f-disp);font-weight:700;font-size:28px;line-height:1.1;letter-spacing:-.01em}
.today .sub{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;color:inherit;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5}
.staffrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.staffrow select{grid-column:1 / 3}
.staffrow select,.staffrow input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;min-height:42px;min-width:0;width:100%;font:inherit;color:inherit}
.staffx{grid-row:1;grid-column:3;border:1px solid var(--line);background:transparent;border-radius:8px;min-height:42px;font-size:20px;color:var(--muted)}
.staffline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:14px;padding:4px 0}
.staffline a{color:var(--accent);font-weight:600}
.btn.small{min-height:36px;padding:6px 10px;font-size:14px}
.offbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px}


.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--f-disp);font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%}
.logday{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px;color:var(--muted)}
.logday input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:40px}
.logday .warn{color:var(--red-ink);font-weight:600}

.install{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);border:1px solid var(--line);font-size:15px}
.install b{display:block;margin-bottom:2px}

.tools{display:flex;flex-wrap:wrap;gap:8px;margin-block:14px 10px}
.tools input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;-webkit-appearance:none}
.tools select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;min-height:44px;max-width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 12px;min-height:44px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--k);background:var(--f)}

.colhead{display:grid;grid-template-columns:minmax(0,1fr) 150px 132px;gap:10px;padding:0 10px 6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.colhead .car{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.list{display:flex;flex-direction:column;gap:6px}
.doc{display:grid;grid-template-columns:minmax(0,1fr) 150px 132px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.name{border:1px solid var(--k);background:var(--f);border-radius:9px;padding:8px 10px;text-align:left;min-width:0;width:100%;color:var(--ink)}
.name .n{font-family:var(--f-disp);font-weight:700;font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.name .c{font-size:13px;color:var(--muted)}
.name .last{font-size:12px;color:var(--t);font-weight:600}
.s-red{--f:var(--red-fill);--k:var(--red-edge);--t:var(--red-ink)}
.s-yel{--f:var(--yel-fill);--k:var(--yel-edge);--t:var(--yel-ink)}
.s-grn{--f:var(--grn-fill);--k:var(--grn-edge);--t:var(--grn-ink)}
.car{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;font-variant-numeric:tabular-nums}
.car div{font-family:var(--f-disp);font-size:22px;font-weight:600;line-height:1.1}
.car small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-ui);letter-spacing:.06em;font-weight:600}
.car .r{font-weight:800}
.act{display:flex;gap:6px;justify-content:flex-end}
.call{flex:1;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;min-height:52px;font-size:16px;padding:0 10px;transition:transform .08s}
.call:active{transform:scale(.96)}
.undo{border:1px solid var(--line);background:transparent;border-radius:10px;min-width:44px;min-height:52px;font-size:20px;color:var(--muted)}
.undo:disabled{opacity:.3}
.empty{padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;color:var(--ink);font-family:var(--f-disp)}
.empty p{margin:0;max-width:52ch}
.flash{animation:fl .6s ease-out}
@keyframes fl{from{box-shadow:0 0 0 4px var(--accent)}to{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.call{transition:none}}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .colhead{display:none}
  .doc{grid-template-columns:minmax(0,1fr) 112px;grid-template-areas:"n n" "c a"}
  .doc .name{grid-area:n}.doc .car{grid-area:c}.doc .act{grid-area:a}
  .today .date{font-size:22px}
}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:760px;max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px 16px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--f-disp);font-size:24px;margin:0 0 4px}
.sheet p{margin:6px 0;color:var(--muted);max-width:62ch}
.sheet .foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;margin-top:12px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.thumb{width:86px;border:2px solid var(--line);border-radius:8px;overflow:hidden;font-size:11px;text-align:center;background:var(--bg)}
.thumb img{display:block;width:100%;height:64px;object-fit:cover}
.thumb div{padding:3px}
.thumb.ok{border-color:var(--grn-edge)} .thumb.bad{border-color:var(--red-edge)} .thumb.busy{border-color:var(--accent)}
.status{margin-top:12px;font-weight:600}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.rtable{overflow-x:auto;margin-top:12px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
.rtable table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.rtable th,.rtable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rtable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);position:sticky;top:0;background:var(--surface)}
.rtable td.num input{width:52px;border:1px solid var(--line);border-radius:6px;padding:4px;background:var(--bg);text-align:center;font-size:16px}
.rtable tr.check td{background:var(--yel-fill)}
.rtable .x{border:0;background:transparent;color:var(--muted);font-size:20px;min-width:40px;min-height:40px}
.summary{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:10px;font-weight:600}
.summary .bad{color:var(--red-ink)} .summary .good{color:var(--grn-ink)}
.hist{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.hist li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.hist button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;min-height:40px;color:var(--red-ink)}
.confirm{margin-top:12px;padding:12px;border-radius:10px;background:var(--red-fill);border:1px solid var(--red-edge);color:var(--ink)}
.small{font-size:13px;color:var(--muted)}
.okline{color:var(--grn-ink);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="row1">
      <div class="today">
        <div class="lbl">Today</div>
        <div class="date" id="todayLbl"></div>
        <div class="sub" id="planLbl"></div>
      </div>
      <div class="actions">
        <button class="btn primary" id="importBtn">Load screenshots</button>
        <button class="btn" id="dayBtn">Today's calls</button>
        <a class="btn" href="route/">Plan my week</a>
        <button class="btn ghost" id="moreBtn">More</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><b id="sToday">0</b><span>Calls today</span></div>
      <div class="stat"><b id="sC">0%</b><span id="sCl">Completed</span></div>
      <div class="stat"><b id="sR">0</b><span>Remaining</span></div>
      <div class="stat"><b id="sDone">0</b><span>Doctors done</span></div>
    </div>
    <div class="bar" aria-hidden="true"><i id="barG" style="background:var(--grn-edge)"></i><i id="barY" style="background:var(--yel-edge)"></i><i id="barR" style="background:var(--red-edge)"></i></div>
    <div class="logday">
      <label for="logDate">Calls are logged on</label>
      <input type="date" id="logDate">
      <span id="logWarn" class="warn" hidden>Not today</span>
      <button class="btn ghost" id="backToday" hidden style="min-height:40px;padding:6px 10px">Back to today</button>
    </div>
  </header>

  <div class="install" id="installTip" hidden>
    <b>Put this on your Home Screen</b>
    Tap Share, then <b style="display:inline">Add to Home Screen</b>, and open it from that icon from now on.
  </div>

  <div class="tools">
    <input type="search" id="q" placeholder="Find a doctor or city" aria-label="Find a doctor or city">
    <select id="city" aria-label="City"></select>
    <div class="seg" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button>
      <button data-f="todo" aria-pressed="false">Still to do</button>
      <button data-f="done" aria-pressed="false">Done</button>
    </div>
    <select id="sort" aria-label="Sort">
      <option value="name">A–Z</option>
      <option value="rem">Most remaining</option>
      <option value="city">By city</option>
      <option value="stale">Longest since call</option>
    </select>
  </div>
  <div class="legend">
    <span style="--f:var(--red-fill);--k:var(--red-edge)">More than half left</span>
    <span style="--f:var(--yel-fill);--k:var(--yel-edge)">Half or less left</span>
    <span style="--f:var(--grn-fill);--k:var(--grn-edge)">All calls done</span>
  </div>
  <div class="colhead" id="colhead"><div>Doctor · tap name for call dates</div><div class="car"><div>C</div><div>A</div><div>R</div></div><div style="text-align:right">Log</div></div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
"use strict";
const KEY = "callplan.tracker.v1";
const TJS = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/";
const CORE = "https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1/";
const LANG = "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int";
const VCACHE = "calltracker-vendor-v1";

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2,"0");
const isoDay = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO = () => isoDay(new Date());
const fromISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const longDate = s => fromISO(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
const shortDate = s => fromISO(s).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const daysAgo = s => Math.round((fromISO(todayISO()) - fromISO(s))/864e5);

/* ---------- state (saved only on this device) ---------- */
const norm = s => String(s||"").toUpperCase().replace(/[^A-Z0-9]+/g," ").trim();
function makeDoc(name, city, c, a, r, last){
  a = Math.max(0, +a||0); c = Math.max(0, +c||0);
  r = (r===""||r==null||isNaN(+r)) ? Math.max(0,a-c) : Math.max(0,+r);
  const lastRpt = /^\d{4}-\d{2}-\d{2}$/.test(last||"") && last <= todayISO() ? last : null;
  return {id:norm(name), name:String(name).trim().toUpperCase(), city:String(city||"").trim().toUpperCase(), c0:c, a, r0:r, lastRpt, log:[]};
}
/* ---------- office staff contacts (shared by the Call Tracker and Plan my week) ----------
   Only a title from a fixed list, a name (letters only) and a phone number (digits only)
   can be saved. There is no free-text note anywhere. */
const STAFF_KEY = "office.staff.v1", DOCOFF_KEY = "doctor.offices.v1";
const STAFF_TITLES = ["Office manager","Medical assistant","Scribe","Front desk","Nurse","Practice administrator"];
try { localStorage.removeItem("doctor.notes.v1"); } catch(e){}
function staffClean(c){
  const n = staffName(c && c.n).trim(), p = staffPhone(c && c.p);
  const t = STAFF_TITLES.includes(c && c.t) ? c.t : "Front desk";
  return n || p ? {t, n, p} : null;
}
function staffName(s){
  s = String(s || "").normalize("NFC").replace(/[^\p{L}\s'\-]/gu, "").replace(/\s+/g, " ").replace(/^[\s'\-]+/, "").slice(0, 30);
  return s.replace(/(^|[\s\-'])(\p{Ll})/gu, (m, a, b) => a + b.toUpperCase());
}
function staffPhone(s){ let d = String(s || "").replace(/\D/g, ""); if (d.length === 11 && d[0] === "1") d = d.slice(1); return d.slice(0, 10); }
function staffFmtPhone(d){ d = staffPhone(d); return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d.length > 6 ? d.slice(0,3) + "-" + d.slice(3,6) + "-" + d.slice(6) : d.length > 3 ? d.slice(0,3) + "-" + d.slice(3) : d; }
function staffAll(){ try { const o = JSON.parse(localStorage.getItem(STAFF_KEY)) || {}; const out = {}; for (const k in o) if (Array.isArray(o[k])){ const l = o[k].map(staffClean).filter(Boolean); if (l.length) out[k] = l; } return out; } catch(e){ return {}; } }
function staffFor(k){ return staffAll()[k] || []; }
function staffSet(k, list){ const all = staffAll(); const l = (list || []).map(staffClean).filter(Boolean).slice(0, 8); if (l.length) all[k] = l; else delete all[k]; try { localStorage.setItem(STAFF_KEY, JSON.stringify(all)); } catch(e){} }
function staffMerge(obj){ if (!obj || typeof obj !== "object") return; for (const k in obj){ if (!Array.isArray(obj[k])) continue; const cur = staffFor(k); obj[k].forEach(c => { const x = staffClean(c); if (x && !cur.some(y => y.n === x.n && y.p === x.p)) cur.push(x); }); staffSet(k, cur); } }
function staffOfficesFor(docId){ try { return (JSON.parse(localStorage.getItem(DOCOFF_KEY)) || {})[docId] || []; } catch(e){ return []; } }
function staffLineHtml(c){
  const p = c.p ? staffFmtPhone(c.p) : "";
  return `<div class="staffline"><span><b>${staffEsc(c.n || "No name")}</b> · ${staffEsc(c.t)}</span>${c.p && c.p.length >= 7 ? `<span><a href="tel:${c.p}">${p}</a> · <a href="sms:${c.p}">Text</a></span>` : (p ? `<span>${p}</span>` : "")}</div>`;
}
const staffEsc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function staffRowHtml(c, i){
  return `<div class="staffrow" data-srow="${i}">
    <select data-st aria-label="Title">${STAFF_TITLES.map(t => `<option${t === c.t ? " selected" : ""}>${t}</option>`).join("")}</select>
    <input data-sn value="${staffEsc(c.n)}" placeholder="Name" aria-label="Name" autocomplete="off" autocapitalize="words" spellcheck="false" maxlength="30">
    <input data-sp value="${staffEsc(staffFmtPhone(c.p))}" placeholder="Phone" aria-label="Phone" type="tel" inputmode="tel" autocomplete="off">
    <button type="button" class="staffx" data-sx aria-label="Remove this contact">×</button>
  </div>`;
}
/* A block that edits the contacts for one office. Call staffWire(box) after inserting it and staffRead(box) to get the list. */
function staffEditorHtml(list){
  const l = list.length ? list : [{t:"Front desk", n:"", p:""}];
  return `<div class="staffed">${l.map(staffRowHtml).join("")}</div><button type="button" class="btn small ghost" data-sadd>+ Add a staff contact</button>`;
}
function staffWire(box){
  const ed = box.querySelector(".staffed");
  const hook = row => {
    const n = row.querySelector("[data-sn]"), p = row.querySelector("[data-sp]");
    n.oninput = () => { const v = staffName(n.value); if (v !== n.value) n.value = v; };
    p.oninput = () => { const v = staffFmtPhone(p.value.replace(/\D/g, "")); if (v !== p.value) p.value = v; };
    row.querySelector("[data-sx]").onclick = () => { row.remove(); if (!ed.children.length) add(); };
  };
  const add = () => { const t = document.createElement("div"); t.innerHTML = staffRowHtml({t:"Front desk", n:"", p:""}, ed.children.length); const row = t.firstElementChild; ed.appendChild(row); hook(row); return row; };
  ed.querySelectorAll(".staffrow").forEach(hook);

/* ---------- derived ---------- */
const done = d => d.c0 + d.log.length;
const rem = d => Math.max(0, d.r0 - d.log.length);
function status(d){
  const r = rem(d);
  if (r === 0) return "grn";
  if (d.a > 0 && r / d.a > 0.5) return "red";
  return "yel";
}
const allDates = d => d.log.concat(d.hist || []);
// most recent call: from calls logged here, or the "My Last Call Date" in the report screenshots
const lastCall = d => { const ad = allDates(d); const l = ad.length ? ad.slice().sort()[ad.length-1] : null; return [l, d.lastRpt].filter(Boolean).sort().pop() || null; };

/* ---------- saving files (share sheet → Save to Files / AirDrop; never uploaded) ---------- */
async function saveFile(name, text, type, title){
  const blob = new Blob([text], {type});
  try {
    const file = new File([blob], name, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title}); return "shared"; }
  } catch(e){ if (e && e.name === "AbortError") return null; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  return "downloaded";
}

/* ---------- export for routing ---------- */
function weekStartISO(iso){ const d = fromISO(iso); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return isoDay(d); }
function routingRows(){
  const t = todayISO(), wk = weekStartISO(t);
  const end = state.planEnd && state.planEnd >= t ? state.planEnd : null;
  const weeksLeft = end ? Math.max(1, Math.ceil((Math.round((fromISO(end)-fromISO(t))/864e5)+1)/7)) : null;
  const rows = state.doctors.filter(d => rem(d) > 0).map(d => {
    const lc = lastCall(d), r = rem(d);
    return { name:d.name, city:d.city, completed:done(d), assigned:d.a, remaining:r,
      lastCall: lc, daysSinceLastCall: lc ? daysAgo(lc) : null,
      callsThisWeek: d.log.filter(x => x >= wk && x <= t).length,
      callsPerWeekNeeded: weeksLeft ? Math.round(r/weeksLeft*100)/100 : null,
      status: status(d)==="red" ? "More than half left" : "Half or less left",
      _share: d.a ? r/d.a : 0 };
  });
  // Most behind first: calls/week needed (or share of plan left), then longest since last call
  rows.sort((a,b) => ((b.callsPerWeekNeeded ?? b._share) - (a.callsPerWeekNeeded ?? a._share))
    || ((b.daysSinceLastCall ?? 9999) - (a.daysSinceLastCall ?? 9999)) || a.name.localeCompare(b.name));
  rows.forEach((r,i) => { r.priority = i+1; delete r._share; });
  return {rows, weeksLeft, end};
}
const csvCell = v => { v = v==null ? "" : String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
function routingCSV(rows){
  const head = ["Priority","Doctor","City","Completed","Assigned","Remaining","Last call","Days since last call","Calls this week","Calls per week needed","Status"];

  return [head.join(","), ...body].join("\n");
}

/* ---------- on-device screenshot reading ---------- */
function parseCallPlanText(text){
  const JUNK_LEAD = /^([^A-Z]{1,3}|[A-Z]|O|Oo|0|\(\)|\[\]|©|@|®|&)$/;
  const DATE = /^\d{1,2}\/\d{1,2}\/\d{2,4}[.,]?$/;
  const PRODUCTISH = /(PRIMARY|SECONDARY|AIRSUPRA|BREZTRI|AEROSPHERE|[A-Za-z]{3,};|;[A-Za-z]{3,})/i;
  const rows = []; let total = null;
  for (let raw of text.split(/\n+/)){
    const line = raw.replace(/[|‘’`“”"]/g," ").replace(/\s+/g," ").trim();
    if (!line) continue;
    const tm = line.match(/^tota[l1I]\W*\s*(\d+)\s+(.*)$/i);
    if (tm){ const nums = (tm[2].match(/\d+/g)||[]).map(Number); if (nums.length>=3) total = {count:+tm[1], c:nums[0], a:nums[1], r:nums[2]}; continue; }
    let tok = line.split(" ");
    // find where product/sales text begins
    let p = tok.findIndex(t => PRODUCTISH.test(t));
    if (p < 2) continue;
    const head = tok.slice(0,p), tail = tok.slice(p);
    // SD1 A: first standalone number after the product text
    const tailNums = tail.join(" ").replace(/^.*?(SECONDARY|PRIMARY)\S*/i,"").match(/\b\d{1,2}\b/g);
    let sdA = tailNums ? +tailNums[0] : null;
    if (sdA === 0) sdA = null;
    // split head into identity part and the C/A/R cluster
    let di = head.findIndex(t => DATE.test(t));
    let ident, cluster;
    let last = null;
    if (di >= 0){ ident = head.slice(0,di); cluster = head.slice(di+1);
      const dm = head[di].match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
      if (dm){ const y = dm[3].length === 2 ? 2000 + +dm[3] : +dm[3]; if (+dm[1] >= 1 && +dm[1] <= 12 && +dm[2] >= 1 && +dm[2] <= 31) last = y + "-" + String(dm[1]).padStart(2,"0") + "-" + String(dm[2]).padStart(2,"0"); } }
    else {
      // no date: cluster = trailing tokens that contain digits or look like OCR noise
      let k = head.length;
      while (k>0 && /\d|^[OoQ]\W*$|^\W+$/.test(head[k-1]) && head.length-k < 6) k--;
      ident = head.slice(0,k); cluster = head.slice(k);
    }
    // identity: strip leading junk (checkbox), and non-word dashes
    ident = ident.map(t => t.replace(/!$/,"I").replace(/^!/,"I")).map(t => t.replace(/^[^A-Za-z]+|[^A-Za-z]+$/g,"")).filter(Boolean);
    while (ident.length > 2 && (ident[0].length===1 || (ident[0].length===2 && /[OQ0]/i.test(ident[0])) || /^(IF|TI|II|IT|IO|OI)$/i.test(ident[0]))) ident.shift();
    ident = ident.filter(t => /^[A-Za-z][A-Za-z'\-]*$/.test(t)).map(t=>t.toUpperCase());
    if (ident.length < 2) continue;
    // Target name is followed by its Last Name column: find the repeat
    let name=null, city="";
    for (let s=ident.length-1; s>=1 && !name; s--){
      for (let m=Math.min(3,s); m>=1; m--){
        if (s+m <= ident.length && ident.slice(s,s+m).join(" ")===ident.slice(s-m,s).join(" ")){
          name = ident.slice(0,s).join(" "); city = ident.slice(s+m).join(" "); break;
        }
      }
      // OCR sometimes glues a short name together: "DAIPARK PARK" -> "DAI PARK"
      if (!name && ident[s].length>=2 && ident[s-1].length>ident[s].length+1 && ident[s-1].endsWith(ident[s])){
        const first = ident[s-1].slice(0, ident[s-1].length-ident[s].length);
        name = [...ident.slice(0,s-1), first, ident[s]].join(" "); city = ident.slice(s+1).join(" ");
      }
    }
    if (!name) continue;
    // numbers
    let digits = cluster.join(" ").replace(/[Oo]/g,"0").replace(/[^0-9]/g,"");
    let c=null,a=null,r=null,sure=false;
    if (digits.length===3){ const [x,y,z]=digits.split("").map(Number); if (x+z===y){ c=x;a=y;r=z;sure=true; } }
    if (!sure && digits.length>=4 && sdA!=null){
      // two-digit values possible (A>=10): try parses
      const cands=[]; const d=digits;
      for (let i=1;i<d.length;i++) for (let j=i+1;j<d.length;j++){
        const x=+d.slice(0,i), y=+d.slice(i,j), z=+d.slice(j);
        if (x+z===y && y===sdA && String(+d.slice(0,i))===d.slice(0,i)) cands.push([x,y,z]);
      }
      if (cands.length===1){ [c,a,r]=cands[0]; sure=true; }
    }
    if (!sure){
      const d = digits.split("").map(Number);
      if (sdA!=null){
        a = sdA; const last = d.length ? d[d.length-1] : null;
        if (last!=null && last<=a){ r=last; c=a-last; } else { c=0; r=a; }
      } else if (d.length>=3){ c=d[0]; r=d[d.length-1]; a=c+r; }
      else if (d.length===2){ a=d[0]; r=Math.min(d[1],a); c=a-r; }
      else if (d.length===1){ a=d[0]; r=a; c=0; }
    }
    if (a==null) continue;
    rows.push({name, city, c, a, r, last, guess: !sure && sdA==null});
  }
  return {rows, total};
}


function simdSupported(){
  try { return WebAssembly.validate(new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11])); } catch(e){ return false; }
}
const CORE_FILE = simdSupported() ? "tesseract-core-simd-lstm.wasm.js" : "tesseract-core-lstm.wasm.js";
async function vendorBlob(url){
  // cache-first from this device's storage; network only the first time
  let res = null;
  try { const c = await caches.open(VCACHE); res = await c.match(url);
        if (!res){ const net = await fetch(url, {mode:"cors"}); if (!net.ok) throw new Error("download failed"); await c.put(url, net.clone()); res = net; } }
  catch(e){ if (!res){ const net = await fetch(url, {mode:"cors"}); if (!net.ok) throw e; res = net; } }
  return URL.createObjectURL(await res.blob());
}
async function ocrReady(){
  try { const c = await caches.open(VCACHE);
    return !!(await c.match(TJS+"tesseract.min.js")) && !!(await c.match(TJS+"worker.min.js")) && !!(await c.match(CORE+CORE_FILE)) && localStorage.getItem("calltracker.langReady")==="1";
  } catch(e){ return false; }
}
let ocrWorker = null;
async function getWorker(onProgress){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract){
    const src = await vendorBlob(TJS+"tesseract.min.js");
    await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("engine")); document.head.appendChild(s); });
  }
  const workerPath = await vendorBlob(TJS+"worker.min.js");
  const corePath = (await vendorBlob(CORE+CORE_FILE)) + "#core.js";
  ocrWorker = await Tesseract.createWorker("eng", 1, {
    workerPath, corePath, langPath: LANG, workerBlobURL: false, cacheMethod: "write",
    logger: m => onProgress && onProgress(m)
  });
  await ocrWorker.setParameters({ tessedit_pageseg_mode: "6", preserve_interword_spaces: "0" });
  try { localStorage.setItem("calltracker.langReady","1"); } catch(e){}
  return ocrWorker;
}

$("importBtn").onclick = () => {
  openSheet(`<h2>Load screenshots</h2>
    <p>Pick every page of your call plan, including the last one with the total row.</p>
    <div class="drop">
      <label class="btn primary" for="shotF">Choose screenshots</label>
      <input type="file" id="shotF" accept="image/*" multiple hidden>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div class="status" id="iStat" aria-live="polite"></div>
    <div class="prog" id="iProg" hidden><i id="iBar"></i></div>
    <div id="review"></div>
    <div class="foot" id="iFoot"><button class="btn" id="closeS">Cancel</button></div>`);
  $("closeS").onclick = closeSheet;
  parsed = []; reportTotal = null;
  $("shotF").onchange = e => runImport([...e.target.files]);
};

let parsed = [], reportTotal = null;
async function runImport(files){
  if (!files.length) return;
  busy = true; importCtl = new AbortController(); const sig = importCtl.signal;
  const shots = files.map(f => ({f, url:URL.createObjectURL(f), st:"wait", n:0}));
  const drawThumbs = () => $("thumbs").innerHTML = shots.map(s=>`<div class="thumb ${s.st}"><img src="${s.url}" alt=""><div>${s.st==="ok"?s.n+" doctors":s.st==="bad"?"Couldn't read":s.st==="busy"?"Reading…":"Waiting"}</div></div>`).join("");
  drawThumbs();
  $("iFoot").innerHTML = `<button class="btn" id="stopI">Stop</button>`;
  $("stopI").onclick = () => importCtl.abort();
  $("iProg").hidden = false;
  const setBar = p => $("iBar").style.width = Math.round(p*100)+"%";
  const byId = new Map(parsed.map(r=>[r.id,r]));
  let worker;
  try {
    $("iStat").textContent = "Getting the reader ready…";
    worker = await getWorker(m => {
      if (m.status && /loading|initializ/i.test(m.status)) { $("iStat").textContent = "Getting the reader ready… (first time needs internet)"; setBar(m.progress||0); }
      else if (m.status === "recognizing text") setBar(m.progress||0);
    });
  } catch(e){
    busy = false; $("iProg").hidden = true;
    $("iStat").textContent = navigator.onLine ? "The reader couldn't start. Close the app fully and open it again." : "The first time you load screenshots, the iPad needs internet to set up the reader. Connect once, then it works offline.";
    $("iFoot").innerHTML = `<button class="btn" id="closeS">Close</button>`; $("closeS").onclick = closeSheet; return;
  }
  for (let i=0;i<shots.length && !sig.aborted;i++){
    const s = shots[i]; s.st="busy"; drawThumbs(); setBar(0);
    $("iStat").textContent = `Reading screenshot ${i+1} of ${shots.length}…`;
    try {
      const { data } = await worker.recognize(s.f);
      if (sig.aborted) break;
      const out = parseCallPlanText(data.text || "");
      let n = 0;
      for (const r of out.rows){
        const d = makeDoc(r.name, r.city, r.c, r.a, r.r, r.last); d.guess = !!r.guess;
        if (d.id && !byId.has(d.id)) { byId.set(d.id, d); n++; }
      }
      if (out.total) reportTotal = out.total;
      s.st = out.rows.length ? "ok" : "bad"; s.n = n;
    } catch(e){ s.st = "bad"; }
    drawThumbs();
  }
  parsed = [...byId.values()].sort((a,b)=>a.name.localeCompare(b.name));
  busy = false; $("iProg").hidden = true;
  const bad = shots.filter(s=>s.st==="bad").length;
  $("iStat").textContent = parsed.length
    ? `Found ${parsed.length} doctors.` + (bad ? ` ${bad} screenshot${bad>1?"s":""} couldn't be read. Retake ${bad>1?"them":"it"} with the iPad's screenshot buttons and add again.` : "")
    : "No doctors found. Make sure the screenshots show the Call Plan Target table clearly.";
  renderReview();
}

function renderReview(){
  if (!parsed.length){ $("iFoot").innerHTML = `<label class="btn" for="moreF">Try other screenshots</label><input type="file" id="moreF" accept="image/*" multiple hidden><button class="btn" id="closeS">Close</button>`;
    $("closeS").onclick = closeSheet; $("moreF").onchange = e => runImport([...e.target.files]); return; }
  const sum = parsed.reduce((t,d)=>({c:t.c+d.c0,a:t.a+d.a,r:t.r+d.r0}),{c:0,a:0,r:0});
  const T = reportTotal;
  const match = T && +T.a===sum.a && +T.c===sum.c && +T.r===sum.r && (!T.count || +T.count===parsed.length);
  const flagged = parsed.filter(d => d.guess || d.c0 + d.r0 !== d.a).length;
  $("review").innerHTML = `
    <div class="summary">
      <span>${parsed.length} doctors · C ${sum.c} · A ${sum.a} · R ${sum.r}</span>
      ${T ? `<span class="${match?"good":"bad"}">${match ? "✓ Matches the report's total row" : `Report's total row: ${T.count?T.count+" doctors · ":""}C ${T.c} · A ${T.a} · R ${T.r}`}</span>` : `<span class="small">Add the last page (with the total row) to double-check the count.</span>`}
    </div>
    ${T && !match ? `<p class="small">The numbers don't match yet. A page may be missing, or a number was misread. Check the highlighted rows against your report.</p>` : ""}
    ${flagged ? `<p class="small">${flagged} highlighted row${flagged>1?"s":""}: the reader wasn't sure of the numbers. Compare with your report and tap a number to fix it.</p>` : ""}
    <div class="rtable"><table><thead><tr><th>Doctor</th><th>City</th><th>C</th><th>A</th><th>R</th><th></th></tr></thead><tbody>
    ${parsed.map((d,i)=>`<tr class="${(d.guess || d.c0+d.r0!==d.a)?"check":""}"><td>${esc(d.name)}</td><td>${esc(d.city)}</td>
      <td class="num"><input id="pc${i}" type="number" inputmode="numeric" min="0" value="${d.c0}" data-i="${i}" data-k="c0" aria-label="Completed"></td>
      <td class="num"><input id="pa${i}" type="number" inputmode="numeric" min="0" value="${d.a}" data-i="${i}" data-k="a" aria-label="Assigned"></td>
      <td class="num"><input id="pr${i}" type="number" inputmode="numeric" min="0" value="${d.r0}" data-i="${i}" data-k="r0" aria-label="Remaining"></td>
      <td><button class="x" data-rm="${i}" aria-label="Remove ${esc(d.name)}">×</button></td></tr>`).join("")}
    </tbody></table></div>
    <div id="confirmBox"></div>`;
  $("review").querySelectorAll("input[data-k]").forEach(inp => inp.onchange = () => { const d = parsed[+inp.dataset.i]; d[inp.dataset.k] = Math.max(0, +inp.value||0); d.guess = false; renderReview(); });
  $("review").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { parsed.splice(+b.dataset.rm,1); renderReview(); });
  const clean = d => ({id:d.id, name:d.name, city:d.city, c0:d.c0, a:d.a, r0:d.r0, lastRpt:d.lastRpt || null, log:[]});
  $("iFoot").innerHTML = `
    <label class="btn" for="moreF">Add more screenshots</label>
    <input type="file" id="moreF" accept="image/*" multiple hidden>
    ${state.doctors.length ? `<button class="btn" id="updI">Update my numbers</button>` : ""}
    <button class="btn primary" id="replI">${state.doctors.length ? "Start a fresh plan with these" : `Use these ${parsed.length} doctors`}</button>`;
  $("moreF").onchange = e => runImport([...e.target.files]);
  if ($("updI")) $("updI").onclick = () => {
    // Numbers come from the newer report; calls logged here are kept as dates (already counted in the report)
    let upd = 0, add = 0;
    for (const p of parsed){
      const d = state.doctors.find(x => x.id === p.id);
      if (d){ d.c0 = p.c0; d.a = p.a; d.r0 = p.r0; d.lastRpt = [p.lastRpt, d.lastRpt].filter(Boolean).sort().pop() || null; d.hist = (d.hist || []).concat(d.log); d.log = []; d.city = p.city || d.city; upd++; }
      else { state.doctors.push(clean(p)); add++; }
    }
    state.source = "updated " + shortDate(todayISO()); save(); render(); closeSheet();
    toast(`Updated ${upd} doctor${upd===1?"":"s"}` + (add ? `, added ${add} new` : ""));
  };
  const replace = () => {
    state = {doctors: parsed.map(clean), source:"loaded " + shortDate(todayISO()), importedAt: todayISO(), updatedAt:0};
    save(); ui = {q:"",city:"",f:"all",sort:"name",flash:null}; $("q").value=""; render(); closeSheet(); toast(`Loaded ${state.doctors.length} doctors`);
  };
  $("replI").onclick = () => {
    if (!state.doctors.length) return replace();
    const logged = state.doctors.reduce((n,d)=>n+d.log.length,0);
    $("confirmBox").innerHTML = `<div class="confirm"><b>Replace your current list?</b><p style="color:inherit">This swaps in these ${parsed.length} doctors${logged ? ` and clears the ${logged} call${logged>1?"s":""} you've logged` : ""}. Save a backup first if you might want them.</p>
      <div class="foot"><button class="btn" id="noR">Keep my list</button><button class="btn primary" id="yesR">Replace</button></div></div>`;
    $("confirmBox").scrollIntoView({block:"nearest"});
    $("noR").onclick = () => $("confirmBox").innerHTML = "";
    $("yesR").onclick = replace;
  };
}

/* ---------- Home Screen + offline ---------- */
const standalone = window.navigator.standalone === true || matchMedia("(display-mode: standalone)").matches;
$("installTip").hidden = standalone;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

render();
</script>
